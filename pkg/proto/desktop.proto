syntax = "proto3";

package awecloud.signaling;

option go_package = "github.com/open-beagle/awecloud-signaling-server/pkg/proto";

// DesktopService Desktop 管理服务
service DesktopService {
  // 认证 - Desktop 用设备凭证认证
  rpc Authenticate(DesktopAuthenticateRequest) returns (DesktopAuthenticateResponse);

  // 心跳 - 保持连接状态（纯心跳，不携带业务数据）
  rpc Heartbeat(stream DesktopHeartbeatRequest) returns (stream DesktopHeartbeatResponse);

  // 数据流 - Server 主动推送业务数据变更
  rpc DataStream(stream DesktopDataRequest) returns (stream DesktopDataResponse);

  // 获取已授权主机列表
  rpc GetAuthorizedHosts(GetAuthorizedHostsRequest) returns (GetAuthorizedHostsResponse);

  // 获取指定主机的服务列表
  rpc GetHostServices(GetHostServicesRequest) returns (GetHostServicesResponse);

  // 获取我的设备列表
  rpc GetMyDevices(GetMyDevicesRequest) returns (GetMyDevicesResponse);

  // 设备下线
  rpc OfflineDevice(OfflineDeviceRequest) returns (OfflineDeviceResponse);

  // 删除设备
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);

  // 切换服务收藏状态
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteResponse);

  // 获取收藏的服务列表
  rpc GetFavoriteServices(GetFavoriteServicesRequest) returns (GetFavoriteServicesResponse);

  // 检查保存的凭据（用于自动登录）
  rpc CheckSavedCredentials(CheckSavedCredentialsRequest) returns (CheckSavedCredentialsResponse);

  // 创建登录会话 - 返回 session_id 和 login_url
  rpc CreateLoginSession(CreateLoginSessionRequest) returns (CreateLoginSessionResponse);

  // 等待登录结果 - 通过 gRPC 双向流等待登录完成
  rpc WaitForLoginResult(stream WaitForLoginResultRequest) returns (stream WaitForLoginResultResponse);

  // 注销 - Desktop 安全离场
  rpc Logout(DesktopLogoutRequest) returns (DesktopLogoutResponse);

  // 域名解析 - Desktop 查询域名对应的 Agent 地址（域名后缀可配置，默认 .beagle）
  rpc ResolveDomain(ResolveDomainRequest) returns (ResolveDomainResponse);

  // 资源发现 - Desktop 查询可访问的资源列表
  rpc GetResources(GetResourcesRequest) returns (GetResourcesResponse);

  // 获取有权访问 Kubernetes 资源的 Tenant 摘要，不创建 ResourceSession
  rpc ListResourceTenants(ListResourceTenantsRequest) returns (ListResourceTenantsResponse);

  // 获取域名列表 - Desktop 查询可访问的域名记录（按类型分类）
  rpc GetDomainList(GetDomainListRequest) returns (GetDomainListResponse);

  // 列出域名（Client 模式专用）- 返回域名及其目标 IP 和端口
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);

  // 更新设备远程桌面（RDP）配置
  rpc UpdateDeviceRDPConfig(UpdateDeviceRDPConfigRequest) returns (UpdateDeviceRDPConfigResponse);

  // 上报远程桌面（RDP）入站会话审计事件
  rpc ReportRDPSessionAudit(ReportRDPSessionAuditRequest) returns (ReportRDPSessionAuditResponse);
}

// ============================================
// 公共消息定义
// ============================================

// DesktopSystemInfo 系统信息（Desktop 专用）
message DesktopSystemInfo {
  string os = 1; // 操作系统：linux / windows / darwin
  string os_version = 2; // 系统版本
  string arch = 3; // CPU 架构：amd64 / arm64
  string hostname = 4; // 主机名
  string cpu = 5; // CPU 型号
  int32 cpu_cores = 6; // CPU 核心数
  int32 memory_gb = 7; // 内存大小（GB）
}

// ============================================
// Desktop 认证
// ============================================

// DesktopAuthenticateRequest Desktop 认证请求
message DesktopAuthenticateRequest {
  uint64 desktop_id = 1; // Desktop ID
  string secret = 2; // Desktop 专属密钥
  string device_fingerprint = 3; // 设备指纹（用于验证）
  DesktopSystemInfo system_info = 4; // 系统信息
}

// DesktopAuthenticateResponse Desktop 认证响应
message DesktopAuthenticateResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string auth_key = 3; // Tailscale PreAuthKey（如需重新连接）
  string server_url = 4; // Headscale 服务器地址
  string domain_suffix = 5; // 当前生效的根品牌域名后缀（如 .beagle）
  string user_domain_label = 6; // 当前账号生效的个人域名中段标识
}

// ============================================
// Desktop 心跳（双向流）
// ============================================

// DesktopHeartbeatRequest Desktop 心跳请求
message DesktopHeartbeatRequest {
  uint64 desktop_id = 1; // Desktop ID
  string tunnel_ip = 2; // 隧道 IP
  bool tunnel_connected = 3; // 隧道连接状态
  string secret = 4; // Desktop 专属密钥（通道鉴权）
  bool rdp_local_ready = 5; // 本机 RDP 服务是否已监听就绪
  int32 rdp_local_port = 6; // 本机 RDP 实际监听端口（如 3389）
  bool rdp_tunnel_exposed = 7; // 隧道侧 3389 入站门禁当前是否开放
}

// AuthorizedService 已授权服务
message AuthorizedService {
  string id = 1; // 服务 ID
  string name = 2; // 服务名称
  string agent_name = 3; // 所属 Agent 名称
  string listen_addr = 4; // 源地址（VPN 地址，如 100.64.0.1:3306）
  string target_addr = 5; // 目标地址（内网地址，如 192.168.1.10:3306）
}

// DesktopHeartbeatResponse Desktop 心跳响应（纯心跳确认，不携带业务数据）
message DesktopHeartbeatResponse {
  // 保留字段号，兼容旧版本（不再填充数据）
  reserved 1;
}

// ============================================
// Desktop 数据流（双向流）
// ============================================

// DesktopDataType 数据类型枚举
enum DesktopDataType {
  DESKTOP_DATA_TYPE_UNSPECIFIED = 0; // 未指定
  DESKTOP_DATA_TYPE_ALL = 1; // 所有数据（初始快照）
  DESKTOP_DATA_TYPE_SERVICES = 2; // 服务列表
  DESKTOP_DATA_TYPE_HOSTS = 3; // 主机列表
  DESKTOP_DATA_TYPE_DEVICES = 4; // 设备列表
  DESKTOP_DATA_TYPE_FAVORITES = 5; // 收藏列表
  DESKTOP_DATA_TYPE_RDP_POLICY = 6; // 本机远程桌面入站门禁策略快照
}

// DesktopDataRequest Desktop 数据流请求
message DesktopDataRequest {
  uint64 desktop_id = 1; // Desktop ID
  DesktopDataType refresh_type = 2; // 请求刷新的数据类型（0 或 ALL 表示全部）
  string secret = 3; // Desktop 专属密钥（通道鉴权）
}

// DesktopDataResponse Desktop 数据流响应（Server 推送）
message DesktopDataResponse {
  DesktopDataType type = 1; // 数据类型
  repeated AuthorizedService services = 2; // 服务列表（当 type = SERVICES 或 ALL）
  repeated AuthorizedHost hosts = 3; // 主机列表（当 type = HOSTS 或 ALL）
  repeated DeviceInfo devices = 4; // 设备列表（当 type = DEVICES 或 ALL）
  repeated string favorite_service_ids = 5; // 收藏的服务 ID 列表（当 type = FAVORITES 或 ALL）
  DesktopInboundRDPPolicy rdp_policy = 6; // 本机远程桌面入站门禁策略（当 type = RDP_POLICY 或 ALL）
  string domain_suffix = 7; // 当前生效的根品牌域名后缀
  string user_domain_label = 8; // 当前账号生效的个人域名中段标识
}

// ============================================
// 获取已授权主机列表
// ============================================

// GetAuthorizedHostsRequest 获取已授权主机列表请求
message GetAuthorizedHostsRequest {
  uint64 desktop_id = 1; // Desktop ID
}

// AuthorizedHost 已授权主机（SSH 授权）
message AuthorizedHost {
  string host_id = 1; // 主机ID（Agent用户ID）
  string host_name = 2; // 主机名称（Agent别名）
  string tunnel_ip = 3; // 隧道IP
  repeated string ssh_users = 4; // 允许的 SSH 用户名列表
  string status = 5; // 状态（online/offline）
  string last_seen = 6; // 最后在线时间
}

// GetAuthorizedHostsResponse 获取已授权主机列表响应
message GetAuthorizedHostsResponse {
  repeated AuthorizedHost hosts = 1; // 主机列表
}

// ============================================
// 获取指定主机的服务列表
// ============================================

// GetHostServicesRequest 获取指定主机的服务列表请求
message GetHostServicesRequest {
  uint64 desktop_id = 1; // Desktop ID
  string host_id = 2; // 主机ID
}

// GetHostServicesResponse 获取指定主机的服务列表响应
message GetHostServicesResponse {
  repeated AuthorizedService services = 1; // 服务列表
}

// ============================================
// 获取我的设备列表
// ============================================

// GetMyDevicesRequest 获取我的设备列表请求
message GetMyDevicesRequest {
  uint64 desktop_id = 1; // Desktop ID
  string secret = 2; // Desktop 专属密钥（通道鉴权）
}

// DeviceInfo 设备信息
message DeviceInfo {
  string device_token = 1; // 设备令牌
  string device_name = 2; // 设备名称
  string os = 3; // 操作系统
  string arch = 4; // 架构
  string hostname = 5; // 主机名
  string status = 6; // 状态（online/offline）
  string last_used_at = 7; // 最后使用时间
  string created_at = 8; // 创建时间
  bool is_current = 9; // 是否是当前设备
  string ip = 10; // 隧道 IP
  uint64 node_id = 11; // 设备节点 ID
  string rdp_mode = 12; // 远程桌面策略：auto / enabled / disabled
  bool rdp_allow_share = 13; // 设备归属人是否允许跨账号临时授权
  bool rdp_admin_disabled = 14; // 平台管理员是否强制熔断关闭
  bool rdp_local_ready = 15; // 目标本机 RDP 服务是否已监听就绪
  int32 rdp_local_port = 16; // 目标本机 RDP 监听端口
  bool rdp_tunnel_exposed = 17; // 目标设备隧道侧 3389 是否开放
  bool rdp_connectable = 18; // 当前调用端是否可直接发起远程桌面连接
  string owner_username = 19; // 设备归属用户名（跨账号授权设备展示用）
  bool is_shared = 20; // 是否为他人跨账号授权给我的设备
  int64 grant_expires_at_unix = 21; // 跨账号授权到期时间戳（秒，0 表示本人设备）
  string host_domain_label = 22; // 设备主机域名前缀标识（如 home / work）
  string device_domain = 23; // 完整三段式设备域名（如 home.mengk.beagle）
  string owner_domain_label = 24; // 设备归属人的个人域名中段标识
}

// GetMyDevicesResponse 获取我的设备列表响应
message GetMyDevicesResponse {
  repeated DeviceInfo devices = 1; // 设备列表
  string domain_suffix = 2; // 当前生效的根品牌域名后缀
  string user_domain_label = 3; // 当前账号生效的个人域名中段标识
}

// ============================================
// 远程桌面（RDP）门禁、配置与会话审计
// ============================================

// AllowedRDPPeer 允许访问本机远程桌面的源节点白名单条目
message AllowedRDPPeer {
  uint64 headscale_node_id = 1; // 允许入站的源 Desktop Headscale Node ID（精确节点级校验）
  uint64 source_node_id = 2; // 允许入站的源 Desktop 数据库 Node ID
  string source_user_name = 3; // 源端归属用户名
  string source_device_name = 4; // 源端设备名称
  uint64 grant_id = 5; // 跨账号授权记录 ID（0 表示本人自访）
  int64 expires_at_unix = 6; // 授权到期时间戳（秒，0 表示本人自访）
  string headscale_user_name = 7; // 源端 Headscale 用户名（如 client-zhangsan）
}

// DesktopInboundRDPPolicy 本机远程桌面入站门禁策略快照
message DesktopInboundRDPPolicy {
  bool effective_enabled = 1; // 综合评估后是否允许暴露隧道 3389 入站转发
  string rdp_mode = 2; // 当前开放模式：auto / enabled / disabled
  bool allow_share = 3; // 是否允许跨账号临时授权
  bool admin_disabled = 4; // 是否被平台管理员强制熔断关闭
  int32 target_port = 5; // 转发到本机的目标端口（默认 3389，或探测到的自定义端口）
  repeated AllowedRDPPeer allowed_peers = 6; // 允许入站的精确 Desktop 节点白名单
  int64 issued_at_unix = 7; // 快照签发时间戳（秒）
  int64 valid_until_unix = 8; // 快照租约有效期截止时间戳（秒，超时失败关闭）
}

// UpdateDeviceRDPConfigRequest 更新本人设备远程桌面与个人域名配置请求
message UpdateDeviceRDPConfigRequest {
  uint64 desktop_id = 1; // 当前发起请求的 Desktop ID
  string secret = 2; // 当前发起请求的 Desktop 密钥（必填，失败关闭）
  uint64 target_node_id = 3; // 要修改的目标本人设备 Node ID（0 表示通过 device_token 解析）
  string device_token = 4; // 兼容设备标识 "<node_id>:***"
  string rdp_mode = 5; // 目标模式：auto / enabled / disabled（空字符串表示不修改）
  bool update_allow_share = 6; // 是否更新 rdp_allow_share 字段
  bool rdp_allow_share = 7; // 是否允许跨账号临时授权
  bool update_host_domain_label = 8; // 是否更新目标设备的主机域名前缀标识
  string host_domain_label = 9; // 目标设备自定义主机域名前缀标识（如 home / work）
  bool update_user_domain_label = 10; // 是否更新当前账号的个人域名中段标识
  string user_domain_label = 11; // 当前账号自定义个人域名中段标识（空字符串恢复默认）
}

// UpdateDeviceRDPConfigResponse 更新本人设备远程桌面与个人域名配置响应
message UpdateDeviceRDPConfigResponse {
  bool success = 1;
  string message = 2;
  DeviceInfo device = 3;
  string domain_suffix = 4;
  string user_domain_label = 5;
}

// ReportRDPSessionAuditRequest 上报远程桌面入站会话审计事件请求
message ReportRDPSessionAuditRequest {
  uint64 desktop_id = 1; // 被控端 Desktop ID
  string secret = 2; // 被控端 Desktop 密钥（必填，失败关闭）
  string session_uuid = 3; // 会话唯一标识（建立与断开关联）
  string event_type = 4; // 事件类型：started / ended / rejected
  uint64 source_headscale_node_id = 5; // 源端 Headscale Node ID
  uint64 source_node_id = 6; // 源端数据库 Node ID
  string source_user_name = 7; // 源端用户名
  string source_device_name = 8; // 源端设备名
  string source_ip = 9; // 源端隧道 IP
  uint64 grant_id = 10; // 命中的跨账号授权 ID（0 表示本人自访或未命中）
  string close_reason = 11; // 结束或拒绝原因
  int64 timestamp_unix = 12; // 事件发生时间戳（秒）
  int64 duration_ms = 13; // 会话持续时长（毫秒，ended 时填写）
}

// ReportRDPSessionAuditResponse 上报远程桌面入站会话审计事件响应
message ReportRDPSessionAuditResponse {
  bool success = 1;
  string message = 2;
}

// ============================================
// 设备下线
// ============================================

// OfflineDeviceRequest 设备下线请求
message OfflineDeviceRequest {
  uint64 desktop_id = 1; // 当前 Desktop ID
  string device_token = 2; // 要下线的设备令牌
  string secret = 3; // 当前 Desktop secret；旧客户端缺失时失败关闭
}

// OfflineDeviceResponse 设备下线响应
message OfflineDeviceResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
}

// ============================================
// 删除设备
// ============================================

// DeleteDeviceRequest 删除设备请求
message DeleteDeviceRequest {
  uint64 desktop_id = 1; // 当前 Desktop ID
  string device_token = 2; // 要删除的设备令牌
  string secret = 3; // 当前 Desktop secret；旧客户端缺失时失败关闭
}

// DeleteDeviceResponse 删除设备响应
message DeleteDeviceResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
}

// ============================================
// 切换服务收藏状态
// ============================================

// ToggleFavoriteRequest 切换服务收藏状态请求
message ToggleFavoriteRequest {
  uint64 desktop_id = 1; // Desktop ID
  string service_id = 2; // 服务 ID
}

// ToggleFavoriteResponse 切换服务收藏状态响应
message ToggleFavoriteResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  bool is_favorite = 3; // 当前收藏状态
}

// ============================================
// 获取收藏的服务列表
// ============================================

// GetFavoriteServicesRequest 获取收藏的服务列表请求
message GetFavoriteServicesRequest {
  uint64 desktop_id = 1; // Desktop ID
}

// GetFavoriteServicesResponse 获取收藏的服务列表响应
message GetFavoriteServicesResponse {
  repeated string service_ids = 1; // 收藏的服务 ID 列表
}


// ============================================
// 创建登录会话
// ============================================

// CreateLoginSessionRequest 创建登录会话请求
message CreateLoginSessionRequest {
  string username_hint = 1; // 用户名提示（可选，用于预填）
  string device_fingerprint = 2; // 设备指纹
  string device_name = 3; // 设备名称
}

// CreateLoginSessionResponse 创建登录会话响应
message CreateLoginSessionResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string session_id = 3; // 登录会话 ID
  string login_url = 4; // 登录页面相对路径（/auth/desktop/{session_id}）
}

// ============================================
// 检查保存的凭据
// ============================================

// CheckSavedCredentialsRequest 检查保存的凭据请求
message CheckSavedCredentialsRequest {
  string server_url = 1; // 服务器地址
  string username = 2; // 用户名
}

// CheckSavedCredentialsResponse 检查保存的凭据响应
message CheckSavedCredentialsResponse {
  bool has_credentials = 1; // 是否有保存的凭据
  string username = 2; // 用户名
  uint64 desktop_id = 3; // Desktop ID（如果有）
  // 注意：不返回 secret，由前端本地存储
}

// ============================================
// 等待登录结果（gRPC 双向流）
// ============================================

// WaitForLoginResultRequest 等待登录结果请求
message WaitForLoginResultRequest {
  string session_id = 1; // 登录会话 ID
  string device_fingerprint = 2; // 设备指纹
}

// WaitForLoginResultResponse 等待登录结果响应
message WaitForLoginResultResponse {
  WaitForLoginResultStatus status = 1; // 状态
  string message = 2; // 消息
  
  // 登录成功时返回
  uint64 desktop_id = 3; // Desktop ID
  string device_token = 4; // 设备令牌
  string auth_key = 5; // Tailscale PreAuthKey
  string server_url = 6; // Headscale 服务器地址
  string username = 7; // 用户名
  string domain_suffix = 8; // 当前生效的根品牌域名后缀
  string user_domain_label = 9; // 当前账号生效的个人域名中段标识
}

// ============================================
// 注销
// ============================================

// DesktopLogoutRequest 注销请求
message DesktopLogoutRequest {
  uint64 desktop_id = 1; // Desktop ID
}

// DesktopLogoutResponse 注销响应
message DesktopLogoutResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string logout_url = 3; // Logto 注销 URL（Desktop 需要用 WebView 打开以清除浏览器会话）
}

// WaitForLoginResultStatus 等待登录结果状态
enum WaitForLoginResultStatus {
  WAIT_FOR_LOGIN_RESULT_STATUS_UNSPECIFIED = 0; // 未指定
  WAIT_FOR_LOGIN_RESULT_STATUS_PENDING = 1; // 等待中
  WAIT_FOR_LOGIN_RESULT_STATUS_SUCCESS = 2; // 登录成功
  WAIT_FOR_LOGIN_RESULT_STATUS_FAILED = 3; // 登录失败
  WAIT_FOR_LOGIN_RESULT_STATUS_TIMEOUT = 4; // 超时
  WAIT_FOR_LOGIN_RESULT_STATUS_CANCELLED = 5; // 已取消
  WAIT_FOR_LOGIN_RESULT_STATUS_DISABLED = 6; // 用户已禁用/待审批
}


// ============================================
// 域名解析
// ============================================

// ResolveDomainRequest 域名解析请求
message ResolveDomainRequest {
  uint64 desktop_id = 1; // Desktop ID
  string domain = 2; // 要解析的域名（如 pg.yygl.beijing.beagle）
}

// ResolveDomainResponse 域名解析响应
message ResolveDomainResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string domain = 3; // 域名
  string agent_ip = 4; // Agent 的 Tailscale IP
  int32 target_port = 5; // 目标端口
  string agent_name = 6; // Agent 名称
  string domain_type = 7; // 域名类型
	reserved 8, 9, 10;
	reserved "namespace", "service_name", "svc_proxy_port";
  // 删除 endpoint_name 字段（P10 重构）
}

// ============================================
// 资源发现
// ============================================

// GetResourcesRequest 资源发现请求
message GetResourcesRequest {
  uint64 desktop_id = 1; // Desktop ID
  string resource_protocol = 2; // 明确协商 resource_session_v2；空表示旧 Desktop
  string tenant_id = 3; // 可选的当前 Tenant；新 Desktop 用于作用域切换，空值保持旧行为
}

message ListResourceTenantsRequest {
  uint64 desktop_id = 1;
}

message ResourceTenantSummary {
  string tenant_id = 1;
  string tenant_name = 2;
}

message ListResourceTenantsResponse {
  repeated ResourceTenantSummary tenants = 1;
}

// SSHResource SSH 资源
message SSHResource {
  uint64 agent_id = 1;
  string agent_name = 2;
  string domain = 3;
  repeated string ssh_users = 4;
}

// K8SAPIResource K8S API 资源
message K8SAPIResource {
  uint64 agent_id = 1;
  string agent_name = 2;
  string domain = 3;
  repeated string k8s_groups = 4;
  repeated string namespaces = 5;
}

// GetResourcesResponse 资源发现响应
message GetResourcesResponse {
  repeated SSHResource ssh = 1;
  repeated K8SAPIResource k8s_api = 2;
  reserved 3;
  reserved "k8s_service";
  repeated ContainerSSHResource container_ssh = 4;
  repeated ContainerServiceResource container_service = 5;
}

// ============================================
// 获取域名列表
// ============================================

// GetDomainListRequest 获取域名列表请求
message GetDomainListRequest {
  uint64 desktop_id = 1; // Desktop ID
}

// DomainItem 域名记录
message DomainItem {
  string domain = 1; // 域名（如 beagle-242.beijing.beagle）
	string type = 2; // 类型：ssh / k8sapi
	string status = 3; // 状态：online / offline
	reserved 4, 6, 7;
	reserved "service_ports", "namespace", "service_name";
	repeated string ssh_users = 5; // SSH 用户列表（ssh 类型时）
  string region = 8; // 区域名称（从 domain 解析，如 beijing）
  // 删除 endpoint_id 字段（P10 重构）
}

// GetDomainListResponse 获取域名列表响应
message GetDomainListResponse {
  repeated DomainItem domains = 1; // 域名列表
}

// ============================================
// 列出域名（Client 模式专用）
// ============================================

// ListDomainsRequest 列出域名请求
message ListDomainsRequest {
  // 空请求，Server 根据 client_id 返回可访问的域名
}

// DomainInfo 域名信息（包含目标 IP 和端口）
message DomainInfo {
  string domain = 1; // 域名，如 kubernetes.beijing.beagle
	string type = 2; // 类型：ssh/k8sapi
  string target_ip = 3; // 目标 Tailscale IP
  int32 target_port = 4; // 目标端口
	string cluster_name = 5; // 集群名称（仅 k8sapi）
	reserved 6, 7, 9;
	reserved "namespace", "service_name", "service_ports";
	string status = 8; // 状态：online/offline
  repeated string ssh_users = 10; // SSH 用户列表（仅 ssh 类型）
  // 删除 endpoint_id 和 endpoint_name 字段（P10 重构）
}

// ListDomainsResponse 列出域名响应
message ListDomainsResponse {
  repeated DomainInfo domains = 1; // 域名列表
}

// ContainerSSHResource is the user-visible Kubernetes Pod projection.
// It contains the selected Pod identity but omits Pod IP and credentials.
message ContainerSSHResource {
  string resource_id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string display_name = 4;
  string provider_id = 5;
  string external_workspace_id = 6;
  string state = 7;
  int64 target_revision = 8;
  uint64 agent_node_id = 9;
  string cluster_id = 10;
  string capability = 11;
  uint32 listen_port = 12;
  string domain = 13;
  string agent_ip = 14;
  repeated string ssh_users = 15;
  string session_id = 16;
  string source_id = 17;
  string target_revision_id = 18;
  int64 authorization_revision = 19;
  string namespace = 20;
  string workload_kind = 21;
  string workload_name = 22;
  string pod_uid = 23;
  string pod_name = 24;
  string container_name = 25;
}

// ContainerServiceResource is the user-visible Kubernetes Service projection.
message ContainerServiceResource {
  string resource_id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string display_name = 4;
  string state = 5;
  int64 target_revision = 6;
  uint64 agent_node_id = 7;
  string agent_ip = 8;
  uint32 svc_proxy_port = 9;
  string domain = 10;
  string namespace = 11;
  string service_uid = 12;
  string service_name = 13;
  string port_name = 14;
  int32 port_number = 15;
  string protocol = 16;
  string session_id = 17;
  string source_id = 18;
  string target_revision_id = 19;
  int64 authorization_revision = 20;
  int32 local_port = 21; // 本地出站代理监听端口（Tunnel 专用：0 表示静默，> 0 开启监听）
  string agent_name = 22; // 目标边缘 Agent 节点名称（Tunnel 1:1 边界校验）
}
