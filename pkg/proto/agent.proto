syntax = "proto3";

package awecloud.signaling;

option go_package = "github.com/open-beagle/awecloud-signaling-server/pkg/proto";

// AgentService Agent管理服务
service AgentService {
  // Agent注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Agent心跳
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // 接收Server指令（双向流）
  rpc ReceiveCommands(stream CommandResponse) returns (stream Command);
  
  // 状态上报
  rpc ReportStatus(StatusReport) returns (StatusResponse);
  
  // 获取已启用的TCP服务列表
  rpc GetEnabledTCPServices(GetTCPServicesRequest) returns (GetTCPServicesResponse);
  
  // 获取已启用的STCP访问列表
  rpc GetEnabledSTCPVisitors(GetSTCPVisitorsRequest) returns (GetSTCPVisitorsResponse);

  // [Tailscale] 上报 Tailscale 状态
  rpc ReportTailscaleStatus(TailscaleStatusReport) returns (StatusResponse);

  // [Tailscale] 上报端口映射状态
  rpc ReportProxyStatus(ProxyStatusReport) returns (StatusResponse);

  // [Tailscale] 获取 Tailscale 状态
  rpc GetTailscaleState(GetStateRequest) returns (GetStateResponse);

  // [Tailscale] 保存 Tailscale 状态
  rpc SaveTailscaleState(SaveStateRequest) returns (SaveStateResponse);
}

// Agent注册请求
message RegisterRequest {
  string agent_name = 1;
  string agent_token = 2;
  string version = 3;  // Agent版本
}

// Agent注册响应
message RegisterResponse {
  bool success = 1;
  string message = 2;
  int64 agent_id = 3;
  string token = 4;  // 隧道认证 Token (FRP, 废弃)
  string server = 5; // 隧道服务器地址 (FRP, 废弃)
  int32 port = 6;    // 隧道服务器端口 (FRP, 废弃)

  // [Tailscale] 新增字段
  string control_url = 7;   // Headscale 控制平面 URL
  string auth_key = 8;      // Tailscale 预认证密钥
  string derp_url = 9;      // DERP 服务器 URL
}

// Agent心跳请求
message HeartbeatRequest {
  int64 agent_id = 1;
  string agent_token = 2;
  string version = 3;  // Agent版本

  // [Tailscale] 新增字段
  string tailscale_ip = 4;   // Tailscale IP
  bool ts_connected = 5;     // Tailscale 连接状态
  string ts_conn_type = 6;   // 连接方式: p2p / derp
  int64 ts_connected_at = 7; // 连接时间（Unix 时间戳，秒）
}

// Agent心跳响应
message HeartbeatResponse {
  bool success = 1;
  int64 timestamp = 2;
}

// Server指令
message Command {
  enum Type {
    CREATE_STCP = 0;
    DELETE_STCP = 1;
    CREATE_TCP = 2;
    DELETE_TCP = 3;
    CREATE_STCP_VISITOR = 4;
    DELETE_STCP_VISITOR = 5;

    // [Tailscale] 新增命令类型
    START_PROXY = 10;   // 启动端口映射（服务暴露）
    STOP_PROXY = 11;    // 停止端口映射
    SYNC_PROXIES = 12;  // 同步所有端口映射
    START_VISITOR = 13; // 启动 Visitor（服务访问）
    STOP_VISITOR = 14;  // 停止 Visitor
    SYNC_VISITORS = 15; // 同步所有 Visitor
  }
  
  string command_id = 1;
  Type type = 2;
  
  // STCP相关字段
  string instance_name = 3;
  string secret_key = 4;
  
  // TCP相关字段
  string service_name = 5;
  int32 remote_port = 6;
  
  // 公共字段
  string local_ip = 7;
  int32 local_port = 8;
  
  // STCP Visitor相关字段
  string visitor_name = 9;
  string server_name = 10;
  string bind_addr = 11;
  int32 bind_port = 12;

  // [Tailscale] 端口映射相关字段
  ProxyCommand proxy_command = 13;
  
  // [Tailscale] Visitor 相关字段
  VisitorCommand visitor_command = 14;
}

// [Tailscale] 端口映射指令（服务暴露）
message ProxyCommand {
  string name = 1;         // 服务名称
  int32 listen_port = 2;   // 监听端口
  string target_addr = 3;  // 目标地址，如 192.168.1.100:3306
}

// [Tailscale] Visitor 指令（服务访问）
message VisitorCommand {
  string name = 1;         // Visitor 名称
  int32 listen_port = 2;   // 本地监听端口
  string target_addr = 3;  // VPN 网络目标地址，如 100.64.0.1:3306
}

// 指令响应
message CommandResponse {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

// 状态上报
message StatusReport {
  int64 agent_id = 1;
  repeated STCPStatus stcp_statuses = 2;
}

message STCPStatus {
  string instance_name = 1;
  string status = 2;  // "running", "stopped", "error"
  int32 active_connections = 3;
}

// 状态响应
message StatusResponse {
  bool success = 1;
}

// 获取TCP服务请求
message GetTCPServicesRequest {
  int64 agent_id = 1;
}

// TCP服务信息
message TCPServiceInfo {
  string service_name = 1;
  string local_ip = 2;
  int32 local_port = 3;
  int32 remote_port = 4;
}

// 获取TCP服务响应
message GetTCPServicesResponse {
  bool success = 1;
  repeated TCPServiceInfo services = 2;
}

// 获取STCP访问请求
message GetSTCPVisitorsRequest {
  string agent_name = 1;
}

// STCP访问信息
message STCPVisitorInfo {
  string visitor_name = 1;
  string server_name = 2;
  string secret_key = 3;
  string bind_addr = 4;
  int32 bind_port = 5;
}

// 获取STCP访问响应
message GetSTCPVisitorsResponse {
  bool success = 1;
  repeated STCPVisitorInfo visitors = 2;
}

// [Tailscale] Tailscale 状态上报
message TailscaleStatusReport {
  int64 agent_id = 1;
  string tailscale_ip = 2;   // Tailscale IP
  bool connected = 3;        // 连接状态
  string conn_type = 4;      // 连接方式: p2p / derp
  int32 latency_ms = 5;      // 延迟（毫秒）
}

// [Tailscale] 端口映射状态（服务暴露）
message ProxyStatus {
  string name = 1;           // 服务名称
  int32 listen_port = 2;     // 监听端口
  string target_addr = 3;    // 目标地址
  string status = 4;         // 状态: running / stopped / error
  int32 connections = 5;     // 当前连接数
  int64 bytes_in = 6;        // 入站流量
  int64 bytes_out = 7;       // 出站流量
  string error_msg = 8;      // 错误信息（status=error 时）
}

// [Tailscale] Visitor 状态（服务访问）
message VisitorStatus {
  string name = 1;           // Visitor 名称
  int32 listen_port = 2;     // 本地监听端口
  string target_addr = 3;    // VPN 目标地址
  string listen_addr = 4;    // 实际监听地址（局域网 IP）
  string status = 5;         // 状态: running / stopped / error
  int32 connections = 6;     // 当前连接数
  int64 bytes_in = 7;        // 入站流量
  int64 bytes_out = 8;       // 出站流量
  string error_msg = 9;      // 错误信息（status=error 时）
}

// [Tailscale] 端口映射状态上报（服务暴露）
message ProxyStatusReport {
  int64 agent_id = 1;
  repeated ProxyStatus proxies = 2;
}

// [Tailscale] Visitor 状态上报（服务访问）
message VisitorStatusReport {
  int64 agent_id = 1;
  repeated VisitorStatus visitors = 2;
}

// [Tailscale] 获取状态请求
message GetStateRequest {
  int64 agent_id = 1;      // Agent ID
  string agent_token = 2;  // Agent 认证令牌
}

// [Tailscale] 获取状态响应
message GetStateResponse {
  bytes state_data = 1;  // Tailscale 状态序列化数据（压缩后）
  bool exists = 2;       // 是否存在历史状态
}

// [Tailscale] 保存状态请求
message SaveStateRequest {
  int64 agent_id = 1;      // Agent ID
  string agent_token = 2;  // Agent 认证令牌
  bytes state_data = 3;    // Tailscale 状态序列化数据（压缩后）
}

// [Tailscale] 保存状态响应
message SaveStateResponse {
  bool success = 1;  // 是否保存成功
}
