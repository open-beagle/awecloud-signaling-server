syntax = "proto3";

package awecloud.signaling;

option go_package = "github.com/open-beagle/awecloud-signaling-server/pkg/proto";

// AgentService Agent管理服务
service AgentService {
  // Agent注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Agent心跳
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // 接收Server指令（双向流）
  rpc ReceiveCommands(stream CommandResponse) returns (stream Command);
  
  // 状态上报
  rpc ReportStatus(StatusReport) returns (StatusResponse);
  
  // 获取已启用的TCP服务列表
  rpc GetEnabledTCPServices(GetTCPServicesRequest) returns (GetTCPServicesResponse);
  
  // 获取已启用的STCP访问列表
  rpc GetEnabledSTCPVisitors(GetSTCPVisitorsRequest) returns (GetSTCPVisitorsResponse);
}

// Agent注册请求
message RegisterRequest {
  string agent_name = 1;
  string agent_token = 2;
}

// Agent注册响应
message RegisterResponse {
  bool success = 1;
  string message = 2;
  int64 agent_id = 3;
  string token = 4;  // 隧道认证 Token
  string server = 5; // 隧道服务器地址（完整 URL 或空）
  int32 port = 6;    // 隧道服务器端口（使用 URL 时为 0）
}

// Agent心跳请求
message HeartbeatRequest {
  int64 agent_id = 1;
  string agent_token = 2;
}

// Agent心跳响应
message HeartbeatResponse {
  bool success = 1;
  int64 timestamp = 2;
}

// Server指令
message Command {
  enum Type {
    CREATE_STCP = 0;
    DELETE_STCP = 1;
    CREATE_TCP = 2;
    DELETE_TCP = 3;
    CREATE_STCP_VISITOR = 4;
    DELETE_STCP_VISITOR = 5;
  }
  
  string command_id = 1;
  Type type = 2;
  
  // STCP相关字段
  string instance_name = 3;
  string secret_key = 4;
  
  // TCP相关字段
  string service_name = 5;
  int32 remote_port = 6;
  
  // 公共字段
  string local_ip = 7;
  int32 local_port = 8;
  
  // STCP Visitor相关字段
  string visitor_name = 9;
  string server_name = 10;
  string bind_addr = 11;
  int32 bind_port = 12;
}

// 指令响应
message CommandResponse {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

// 状态上报
message StatusReport {
  int64 agent_id = 1;
  repeated STCPStatus stcp_statuses = 2;
}

message STCPStatus {
  string instance_name = 1;
  string status = 2;  // "running", "stopped", "error"
  int32 active_connections = 3;
}

// 状态响应
message StatusResponse {
  bool success = 1;
}

// 获取TCP服务请求
message GetTCPServicesRequest {
  int64 agent_id = 1;
}

// TCP服务信息
message TCPServiceInfo {
  string service_name = 1;
  string local_ip = 2;
  int32 local_port = 3;
  int32 remote_port = 4;
}

// 获取TCP服务响应
message GetTCPServicesResponse {
  bool success = 1;
  repeated TCPServiceInfo services = 2;
}

// 获取STCP访问请求
message GetSTCPVisitorsRequest {
  string agent_name = 1;
}

// STCP访问信息
message STCPVisitorInfo {
  string visitor_name = 1;
  string server_name = 2;
  string secret_key = 3;
  string bind_addr = 4;
  int32 bind_port = 5;
}

// 获取STCP访问响应
message GetSTCPVisitorsResponse {
  bool success = 1;
  repeated STCPVisitorInfo visitors = 2;
}
