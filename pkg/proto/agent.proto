syntax = "proto3";

package awecloud.signaling;

option go_package = "github.com/open-beagle/awecloud-signaling-server/pkg/proto";

// AgentService Agent 管理服务
service AgentService {
  // 注册 - Agent 首次连接时调用
  rpc Register(AgentRegisterRequest) returns (AgentRegisterResponse);

  // 认证 - Agent 重连时调用
  rpc Authenticate(AgentAuthenticateRequest) returns (AgentAuthenticateResponse);

  // 心跳 - 双向流，保持连接并同步状态
  rpc Heartbeat(stream AgentHeartbeatRequest) returns (stream AgentHeartbeatResponse);

  // 获取实时状态 - Server 主动调用（用于 Web 详情页刷新）
  rpc GetRealtimeStatus(GetRealtimeStatusRequest) returns (GetRealtimeStatusResponse);

  // 上报本地服务状态
  rpc ReportProxyStatus(ReportProxyStatusRequest) returns (ReportProxyStatusResponse);

  // 上报远程服务状态
  rpc ReportVisitorStatus(ReportVisitorStatusRequest) returns (ReportVisitorStatusResponse);

  // 上报网络变化
  rpc ReportNetworkChange(ReportNetworkChangeRequest) returns (ReportNetworkChangeResponse);

  // SVCProxy - K8S Service 代理（双向流，Desktop → Agent → K8S ClusterIP）
  rpc SVCProxy(stream SVCProxyData) returns (stream SVCProxyData);
}

// ============================================
// 公共消息定义
// ============================================

// SystemInfo 系统信息
message SystemInfo {
  string os = 1; // 操作系统：linux / windows / darwin
  string os_version = 2; // 系统版本
  string arch = 3; // CPU 架构：amd64 / arm64
  string hostname = 4; // 主机名
  string cpu = 5; // CPU 型号
  int32 cpu_cores = 6; // CPU 核心数
  int32 memory_gb = 7; // 内存大小（GB）
}

// NetworkInterface 网络接口信息
message NetworkInterface {
  string name = 1; // 网卡名称（如 eth0, ens192）
  string ip = 2; // IP 地址
  string mask = 3; // 子网掩码
  string gateway = 4; // 网关地址
}

// ============================================
// Agent 注册
// ============================================

// AgentRegisterRequest Agent 注册请求
message AgentRegisterRequest {
  string name = 1; // Agent 名称
  string secret = 2; // 认证密钥
  string version = 3; // Agent 版本号
  SystemInfo system_info = 4; // 系统信息
}

// AgentRegisterResponse Agent 注册响应
message AgentRegisterResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  uint64 agent_id = 3; // Agent ID（Headscale User ID）
  string auth_key = 4; // Tailscale PreAuthKey，用于隧道连接
  string server_url = 5; // Headscale 服务器地址
}

// ============================================
// Agent 认证
// ============================================

// AgentAuthenticateRequest Agent 认证请求
message AgentAuthenticateRequest {
  uint64 agent_id = 1; // Agent ID
  string secret = 2; // 认证密钥
  string version = 3; // Agent 版本号
  SystemInfo system_info = 4; // 系统信息
}

// AgentAuthenticateResponse Agent 认证响应
message AgentAuthenticateResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string auth_key = 3; // Tailscale PreAuthKey（如需重新连接）
  string server_url = 4; // Headscale 服务器地址
}

// ============================================
// Agent 心跳（双向流）
// ============================================

// ServiceStatus 端口映射服务状态
message ServiceStatus {
  string service_id = 1; // 服务 ID
  bool running = 2; // 是否运行中
  string error = 3; // 错误信息（如有）
}

// ForwardStatus 端口访问服务状态
message ForwardStatus {
  string forward_id = 1; // 端口访问 ID
  bool running = 2; // 是否运行中
  string error = 3; // 错误信息（如有）
}

// AgentHeartbeatRequest Agent 心跳请求
message AgentHeartbeatRequest {
  uint64 agent_id = 1; // Agent ID
  string tunnel_ip = 2; // 隧道 IP
  bool tunnel_connected = 3; // 隧道连接状态
  repeated ServiceStatus service_status = 4; // 端口映射服务状态列表
  repeated ForwardStatus forward_status = 5; // 端口访问服务状态列表
  // 网络信息（首次心跳或变更时上报）
  string hostname = 6; // 主机名
  string runtime = 7; // 运行环境：docker / kubernetes / physical
  repeated NetworkInterface networks = 8; // 网络接口列表
  // ZTNA 域名注册（首次心跳或变更时上报）
  repeated DomainRegistration domain_registrations = 9; // 域名注册列表
  // K8S Service 发现数据（Agent 上报）
  repeated DiscoveredK8SService discovered_services = 10; // 发现的 K8S Service 列表
  // 已连接的 Endpoint 列表（Agent 上报）
  repeated ConnectedEndpoint connected_endpoints = 11; // 已连接的 Endpoint 列表
}

// ConnectedEndpoint Agent 上报的已连接 Endpoint 信息
message ConnectedEndpoint {
  string name = 1;           // Endpoint 名称
  string status = 2;         // 状态：online
  repeated EndpointCapabilityInfo capabilities = 3; // 启用的能力列表
}

// DiscoveredK8SService Agent 发现的 K8S Service（心跳上报）
message DiscoveredK8SService {
  string namespace = 1;          // 命名空间
  string service_name = 2;      // Service 名称
  string cluster_ip = 3;        // ClusterIP
  repeated ServicePort ports = 4; // 端口列表
  map<string, string> labels = 5; // 标签
}

// ServicePort K8S Service 端口
message ServicePort {
  string name = 1;     // 端口名称
  int32 port = 2;      // 端口号
  string protocol = 3; // 协议（TCP/UDP）
}

// DomainRegistration 域名注册信息（Agent 心跳上报）
message DomainRegistration {
  string domain = 1;       // 完整域名（如 beagle-242.beijing.beagle）
  string type = 2;         // 能力类型：ssh / k8sapi / k8ssvc
  string target_ip = 3;    // 目标 IP（Node 的 Tailscale IP 或 ClusterIP）
  int32 target_port = 4;   // 目标端口
  string namespace = 5;    // K8S 命名空间（k8ssvc 类型时）
  string service_name = 6; // K8S Service 名称（k8ssvc 类型时）
  string endpoint_id = 7;  // 关联的 Endpoint ID（Endpoint 类型时）
  uint64 node_id = 8;      // 关联的 Node ID（Node 注册时）
}

// ServiceConfig 端口映射配置
message ServiceConfig {
  string id = 1; // 服务 ID
  string name = 2; // 服务名称
  string source_addr = 3; // 源地址（VPN IP:端口，如 100.64.0.1:80）
  string target_addr = 4; // 目标地址（局域网地址，如 192.168.1.10:80）
  bool enabled = 5; // 是否启用
}

// ForwardConfig 端口访问配置
message ForwardConfig {
  string id = 1; // 端口访问 ID
  string service_id = 2; // 关联的目标服务 ID
  string service_name = 3; // 关联的目标服务名称
  string source_addr = 4; // 源地址（局域网 IP:端口，如 192.168.1.100:13306）
  string target_addr = 5; // 目标地址（VPN 地址，如 100.64.0.1:3306）
  bool enabled = 6; // 是否启用
}

// AgentHeartbeatResponse Agent 心跳响应
message AgentHeartbeatResponse {
  int64 config_version = 1; // 配置版本号
  repeated ServiceConfig services = 2; // 端口映射配置（如有变更）
  repeated ForwardConfig forwards = 3; // 端口访问配置（如有变更）
  string domain_suffix = 4; // 域名后缀（如 .beagle），由 Server 下发
  repeated K8SPermission k8s_permissions = 5; // K8S API 授权列表
  repeated K8SServicePermission k8s_service_permissions = 6; // K8S Service 授权列表
  bool request_immediate_report = 7; // Server 请求 Agent 立即上报一次心跳数据
  AgentCapabilityConfig capability_config = 8; // Agent 能力配置（Server 远程控制）
}

// AgentCapabilityConfig Agent 能力配置（Server 远程控制）
// 通过 xxx_set 标志位区分"Server 设置为 false/0"和"Server 未设置"
message AgentCapabilityConfig {
  bool ssh_enabled = 1;              // SSH 开关
  bool ssh_enabled_set = 2;         // SSH 开关是否由 Server 设置（始终为 true）

  bool k8s_enabled = 3;             // K8S API 开关
  bool k8s_enabled_set = 4;         // K8S API 开关是否由 Server 设置
  int32 k8s_listen_port = 5;        // K8S API 监听端口
  bool k8s_listen_port_set = 6;     // K8S API 监听端口是否由 Server 设置
  string k8s_api_server = 7;        // K8S API Server 地址
  bool k8s_api_server_set = 8;      // K8S API Server 地址是否由 Server 设置

  bool svc_enabled = 9;             // K8S Service 开关
  bool svc_enabled_set = 10;        // K8S Service 开关是否由 Server 设置
  string svc_label_selector = 11;   // 标签选择器
  bool svc_label_selector_set = 12; // 标签选择器是否由 Server 设置
  string svc_namespaces = 13;       // 命名空间列表（逗号分隔）
  bool svc_namespaces_set = 14;     // 命名空间列表是否由 Server 设置
  int32 svc_listen_port_base = 15;  // gRPC 监听端口
  bool svc_listen_port_base_set = 16; // gRPC 监听端口是否由 Server 设置

  bool endpoint_enabled = 17;          // Endpoint 功能开关
  bool endpoint_enabled_set = 18;      // Endpoint 功能开关是否由 Server 设置
  int32 endpoint_listen_port = 19;     // Endpoint 内网 gRPC 监听端口（默认 50052）
  bool endpoint_listen_port_set = 20;  // Endpoint 监听端口是否由 Server 设置
  string endpoint_token = 21;          // Endpoint 注册令牌（ep_ 前缀）
  bool endpoint_token_set = 22;        // Endpoint 令牌是否由 Server 设置
}

// K8SPermission K8S API 授权信息（心跳响应下发给 Agent）
message K8SPermission {
  uint64 user_id = 1;            // 被授权用户 ID
  string user_name = 2;          // 被授权用户名
  repeated string k8s_groups = 3; // K8S Impersonation 分组
  repeated string namespaces = 4; // 允许的命名空间（空表示全部）
  bool is_group = 5;             // 是否来自分组授权
}

// K8SServicePermission K8S Service 授权信息（心跳响应下发给 Agent）
message K8SServicePermission {
  uint64 user_id = 1;              // 被授权用户 ID
  string user_name = 2;            // 被授权用户名
  repeated string namespaces = 3;   // 允许的命名空间（空表示全部）
  repeated string service_names = 4; // 允许的 Service 名称（空表示全部）
  bool is_group = 5;               // 是否来自分组授权
}

// ============================================
// 获取实时状态
// ============================================

// GetRealtimeStatusRequest 获取实时状态请求
message GetRealtimeStatusRequest {
  uint64 agent_id = 1; // Agent ID
}

// GetRealtimeStatusResponse 获取实时状态响应
message GetRealtimeStatusResponse {
  string hostname = 1; // 主机名
  string runtime = 2; // 运行环境：docker / k8s / vm / physical
  repeated NetworkInterface networks = 3; // 网络接口列表
  string tunnel_ip = 4; // 隧道 IP
  bool tunnel_connected = 5; // 隧道连接状态
  int64 tunnel_connected_time = 6; // 隧道连接时间（Unix 时间戳）
}

// ============================================
// 状态上报
// ============================================

// ProxyStatus 本地服务状态
message ProxyStatus {
  string service_id = 1; // 服务 ID
  string status = 2; // 状态：running/disabled/error/pending
  string error_code = 3; // 错误代码
  string error_msg = 4; // 错误信息
}

// ReportProxyStatusRequest 上报本地服务状态请求
message ReportProxyStatusRequest {
  uint64 agent_id = 1; // Agent ID
  repeated ProxyStatus statuses = 2; // 状态列表
}

// ReportProxyStatusResponse 上报本地服务状态响应
message ReportProxyStatusResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
}

// VisitorStatus 远程服务状态
message VisitorStatus {
  string forward_id = 1; // 远程服务 ID
  string status = 2; // 状态：running/disabled/error/pending
  string configured_addr = 3; // 配置的源地址
  string actual_addr = 4; // 实际使用的源地址
  bool ip_changed = 5; // IP 是否变化
  string change_reason = 6; // 变化原因：DHCP_IP_CHANGE / NETWORK_INTERFACE_LOST
  string error_code = 7; // 错误代码
  string error_msg = 8; // 错误信息
}

// ReportVisitorStatusRequest 上报远程服务状态请求
message ReportVisitorStatusRequest {
  uint64 agent_id = 1; // Agent ID
  repeated VisitorStatus statuses = 2; // 状态列表
}

// ReportVisitorStatusResponse 上报远程服务状态响应
message ReportVisitorStatusResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
}

// ReportNetworkChangeRequest 上报网络变化请求
message ReportNetworkChangeRequest {
  uint64 agent_id = 1; // Agent ID
  repeated NetworkInterface networks = 2; // 新的网络接口列表
}

// ReportNetworkChangeResponse 上报网络变化响应
message ReportNetworkChangeResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
}

// ============================================
// SVCProxy（K8S Service 代理）
// ============================================

// SVCProxyData K8S Service 代理数据帧
// 首包携带连接参数（is_connect=true），后续包携带数据
message SVCProxyData {
  string namespace = 1;      // 目标命名空间（首包携带）
  string service_name = 2;   // 目标 Service 名称（首包携带）
  int32 port = 3;            // 目标端口（首包携带）
  bytes data = 4;            // 数据载荷
  bool is_connect = 5;       // 是否为连接请求（首包 true）
  bool is_close = 6;         // 是否为关闭通知
  string error = 7;          // 错误信息（如有）
}

// ============================================
// EndpointService（Agent 内网 gRPC Server，Endpoint 作为 Client 连接）
// ============================================

// EndpointService Endpoint 管理服务（Agent 端实现，监听内网 50052 端口）
service EndpointService {
  // 注册 - Endpoint 连接 Agent 时调用，用 token 认证并注册自己
  rpc Register(EndpointRegisterRequest) returns (EndpointRegisterResponse);

  // 心跳 - Endpoint 定期上报状态，Agent 下发配置
  rpc Heartbeat(stream EndpointHeartbeatRequest) returns (stream EndpointHeartbeatResponse);
}

// EndpointRegisterRequest Endpoint 注册请求
message EndpointRegisterRequest {
  string token = 1;          // 注册令牌（ep_ 前缀，Server 生成）
  string name = 2;           // Endpoint 名称（如 hostname）
  string version = 3;        // Endpoint 版本号
  SystemInfo system_info = 4; // 系统信息
}

// EndpointRegisterResponse Endpoint 注册响应
message EndpointRegisterResponse {
  bool success = 1;          // 是否成功
  string message = 2;        // 响应消息
  string endpoint_id = 3;    // Endpoint ID（Agent 分配）
}

// EndpointHeartbeatRequest Endpoint 心跳请求
message EndpointHeartbeatRequest {
  string token = 1;          // 注册令牌（用于身份验证）
  string name = 2;           // Endpoint 名称
  repeated EndpointCapabilityInfo capabilities = 3; // 启用的能力列表
}

// EndpointCapabilityInfo Endpoint 单项能力信息
message EndpointCapabilityInfo {
  string type = 1;           // 能力类型：ssh / k8sapi / k8sservice
  string host = 2;           // SSH 内网地址（SSH 类型时）
  int32 port = 3;            // SSH 端口（SSH 类型时，默认 22）
  string api_server = 4;     // K8S API Server 地址（K8SAPI 类型时）
}

// EndpointHeartbeatResponse Endpoint 心跳响应
message EndpointHeartbeatResponse {
  bool success = 1;          // 是否成功
  string message = 2;        // 响应消息
}
