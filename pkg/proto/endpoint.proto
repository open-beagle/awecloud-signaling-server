syntax = "proto3";

package awecloud.signaling;

option go_package = "github.com/open-beagle/awecloud-signaling-server/pkg/proto";

import "pkg/proto/update.proto";
import "google/protobuf/timestamp.proto";

// ============================================
// EndpointService（Agent 内网 gRPC Server，Endpoint 作为 Client 连接）
// ============================================

// EndpointService Endpoint 管理服务（Agent 端实现，监听内网 50052 端口）
service EndpointService {
  // 注册 - Endpoint 连接 Agent 时调用，用 token 认证并注册自己
  rpc Register(EndpointRegisterRequest) returns (EndpointRegisterResponse);

  // 心跳 - Endpoint 定期上报状态，Agent 下发配置
  rpc Heartbeat(stream EndpointHeartbeatRequest) returns (stream EndpointHeartbeatResponse);

  // 上报完整供给清单；Endpoint 身份由既有 Endpoint Token 验证。
  rpc ReportSupplyInventory(stream SupplyInventoryEnvelope) returns (stream SupplyInventoryAck);

  // 上报 Namespace 内工作负载清单；Endpoint 身份由既有 Endpoint Token 验证。
  rpc ReportWorkloadInventory(stream WorkloadInventoryEnvelope) returns (stream WorkloadInventoryAck);

  // OpenShell - Agent 指令 Endpoint 开启 shell 会话（gRPC 双向流）
  rpc OpenShell(stream ShellData) returns (stream ShellData);

  // OpenK8SAPIProxy - Agent 指令 Endpoint 开启 K8S API 代理（gRPC 双向流）
  rpc OpenK8SAPIProxy(stream K8SAPIProxyData) returns (stream K8SAPIProxyData);

  // OpenSVCProxy - Agent 指令 Endpoint 开启 K8S Service 代理（gRPC 双向流）
  rpc OpenSVCProxy(stream EndpointSVCProxyData) returns (stream EndpointSVCProxyData);

  // OpenRawStream - Agent 指令 Endpoint 开启原始字节流（用于协议升级，如 kubectl logs/exec）
  rpc OpenRawStream(stream RawStreamData) returns (stream RawStreamData);
}

// ============================================
// Endpoint 注册
// ============================================

// EndpointRegisterRequest Endpoint 注册请求
message EndpointRegisterRequest {
  string token = 1; // 注册令牌（ep_ 前缀，Server 生成）
  string name = 2; // Endpoint 名称（如 hostname）
  string version = 3; // Endpoint 版本号
}

// EndpointRegisterResponse Endpoint 注册响应
message EndpointRegisterResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  string endpoint_id = 3; // Endpoint ID（Agent 分配）
}

// ============================================
// Endpoint 心跳
// ============================================

// EndpointHeartbeatRequest Endpoint 心跳请求
message EndpointHeartbeatRequest {
  string token = 1; // 注册令牌（用于身份验证）
  string name = 2; // Endpoint 名称
  repeated EndpointCapabilityInfo capabilities = 3; // 启用的能力列表
  repeated DiscoveredK8SService discovered_services = 4; // Endpoint 发现的 K8S Service
  string version = 5; // Endpoint 当前运行版本
  string os = 6; // Endpoint 操作系统
  
  // SSH 能力配置（从 Endpoint 自动检测）
  repeated string ssh_users = 7; // 允许的 SSH 用户列表
  
  // K8S API 能力配置
  string k8sapi_api_server = 8; // K8S API Server 地址
  
  // K8S Service 能力配置
  string k8sservice_label_selector = 9; // 标签选择器
  repeated string k8sservice_namespaces = 10; // 命名空间列表
  string arch = 11; // Endpoint CPU 架构
  string updater_protocol = 12; // 支持的 updater 协议版本
  repeated UpdateStatus update_statuses = 13; // Endpoint 更新状态
}

// EndpointCapabilityInfo Endpoint 单项能力信息
message EndpointCapabilityInfo {
  string type = 1; // 能力类型：ssh / k8sapi / k8sservice
  string host = 2; // SSH 内网地址（SSH 类型时）
  int32 port = 3; // SSH 端口（SSH 类型时，默认 22）
  string api_server = 4; // K8S API Server 地址（K8SAPI 类型时）
}

// EndpointHeartbeatResponse Endpoint 心跳响应
message EndpointHeartbeatResponse {
  bool success = 1; // 是否成功
  string message = 2; // 响应消息
  repeated ShellRequest shell_requests = 3; // Shell 请求通知
  repeated K8SAPIProxyRequest k8sapi_proxy_requests = 4; // K8S API 代理请求通知
  repeated SVCProxyRequest svc_proxy_requests = 5; // K8S Service 代理请求通知
  repeated RawStreamRequest raw_stream_requests = 6; // 原始字节流请求通知（用于协议升级）

  // Server 下发的能力配置（由 Web 界面管理，Endpoint 应以此为准）
  bool ssh_enabled = 10; // SSH 能力是否启用
  bool ssh_enabled_set = 11; // ssh_enabled 是否有效（false 表示未下发）
  bool k8sapi_enabled = 12; // K8S API 能力是否启用
  bool k8sapi_enabled_set = 13; // k8sapi_enabled 是否有效
  string k8sapi_api_server = 14; // K8S API Server 地址（Server 存储的值）
  bool k8sservice_enabled = 15; // K8S Service 能力是否启用
  bool k8sservice_enabled_set = 16; // k8sservice_enabled 是否有效
  repeated UpdateDirective update_directives = 17; // Endpoint 更新任务
  SupplyInventoryConfig supply_inventory_config = 18; // Server 授权的库存上报配置；空表示不支持或未启用
  WorkloadInventoryConfig workload_inventory_config = 19; // Server 授权的工作负载上报配置
}

// SupplyInventoryConfig 是 Server 下发的可信上报映射，不由采集载荷声明。
message SupplyInventoryConfig {
  bool enabled = 1;
  string protocol_version = 2;
  string technical_resource_id = 3;
  int64 credential_revision = 4;
}

// SupplyInventoryEnvelope 承载单个完整快照批次。Provider、Tenant 和 Allocation
// 权限字段禁止出现在该协议及其标签中。
message SupplyInventoryEnvelope {
  uint32 schema_version = 1;
  string source_epoch = 2;
  uint64 sequence = 3;
  string snapshot_id = 4;
  uint32 batch_index = 5;
  uint32 batch_count = 6;
  google.protobuf.Timestamp observed_at = 7;
  google.protobuf.Timestamp sent_at = 8;
  string payload_hash = 9; // 规范 JSON payload 的小写 SHA-256
  string source_technical_resource_id = 10; // 仅由 Agent 在 Endpoint 转发时填充
  int64 credential_revision = 11;
  repeated KubernetesClusterInventory kubernetes_clusters = 12;
}

message KubernetesClusterInventory {
  string cluster_uid = 1;
  string kube_system_namespace_uid = 2;
  string ca_sha256 = 3;
  string display_name = 4;
  string kubernetes_version = 5;
  repeated string capabilities = 6;
  repeated KubernetesNamespaceInventory namespaces = 7;
}

message KubernetesNamespaceInventory {
  string uid = 1;
  string name = 2;
  map<string, string> labels = 3;
  string status = 4;
}

message SupplyInventoryAck {
  uint64 accepted_sequence = 1;
  string snapshot_id = 2;
  string result_code = 3;
  bool retryable = 4;
  uint32 retry_after_seconds = 5;
  bool replay = 6;
  bool snapshot_committed = 7;
}

// WorkloadInventoryConfig 是 Server 下发的可信来源映射。Token 仍使用既有连接凭据。
message WorkloadInventoryConfig {
  bool enabled = 1;
  string protocol_version = 2;
  string technical_resource_id = 3;
  int64 credential_revision = 4;
  string capability = 5;
}

// WorkloadInventoryEnvelope 固定承载一个 Namespace 和一种工作负载类型的快照批次。
// Provider、Tenant、Allocation、Resource、Grant、Session 和内部 Scope ID 不属于该协议。
message WorkloadInventoryEnvelope {
  uint32 schema_version = 1;
  string source_epoch = 2;
  uint64 sequence = 3;
  string snapshot_id = 4;
  uint32 batch_index = 5;
  uint32 batch_count = 6;
  google.protobuf.Timestamp observed_at = 7;
  google.protobuf.Timestamp sent_at = 8;
  string payload_hash = 9;
  string source_technical_resource_id = 10; // 仅由 Agent 在 Endpoint 转发时填充
  int64 credential_revision = 11;
  string cluster_identity_digest = 12;
  string namespace_uid = 13;
  string namespace_name = 14;
  string snapshot_kind = 15; // service_port / container
  repeated WorkloadServicePort service_ports = 16;
  repeated WorkloadContainer containers = 17;
}

message WorkloadServicePort {
  string service_uid = 1;
  string service_name = 2;
  string cluster_ip = 3;
  string port_name = 4;
  uint32 port_number = 5;
  string protocol = 6;
  bool ready = 7;
  map<string, string> labels_allowlist = 8;
}

message WorkloadContainer {
  string workload_uid = 1;
  string workload_kind = 2;
  string workload_name = 3;
  string pod_uid = 4;
  string pod_name = 5;
  string container_name = 6;
  bool ready = 7;
  map<string, string> labels_allowlist = 8;
}

message WorkloadInventoryAck {
  uint64 accepted_sequence = 1;
  string snapshot_id = 2;
  uint32 batch_index = 3;
  string result_code = 4;
  bool replayed = 5;
  bool committed = 6;
  bool retryable = 7;
  uint32 retry_after_ms = 8;
  google.protobuf.Timestamp server_received_at = 9;
}

// ============================================
// 共享类型（Endpoint 和 Agent 都使用）
// ============================================

// DiscoveredK8SService 发现的 K8S Service（Endpoint/Agent 心跳上报）
message DiscoveredK8SService {
  string namespace = 1; // 命名空间
  string service_name = 2; // Service 名称
  string cluster_ip = 3; // ClusterIP
  repeated ServicePort ports = 4; // 端口列表
  map<string, string> labels = 5; // 标签
}

// ServicePort K8S Service 端口
message ServicePort {
  string name = 1; // 端口名称
  int32 port = 2; // 端口号
  string protocol = 3; // 协议（TCP/UDP）
}

// ============================================
// Shell 请求与数据（Endpoint SSH 会话）
// ============================================

// ShellRequest Agent 通知 Endpoint 的 Shell 请求
message ShellRequest {
  string session_id = 1; // 会话 ID（Agent 生成，Endpoint 回调时携带）
  string login = 2; // 登录用户名（如 "root"）
  uint32 rows = 3; // 终端行数
  uint32 cols = 4; // 终端列数
  string command = 5; // 要执行的命令（exec 模式时使用，为空则为交互式 shell）
}

// ShellData Endpoint Shell 会话数据帧
message ShellData {
  bool is_open = 1; // 是否为开启会话请求（首包 true）
  string session_id = 2; // 会话 ID
  string token = 3; // 注册令牌（首包携带）
  bytes data = 4; // 数据载荷（stdin / stdout）
  bool is_resize = 5; // 是否为窗口大小变更
  uint32 rows = 6; // 新的终端行数
  uint32 cols = 7; // 新的终端列数
  bool is_close = 8; // 是否为关闭通知
  int32 exit_code = 9; // 退出码
  string error = 10; // 错误信息
}

// ============================================
// K8S API 代理（Endpoint K8SAPI 会话）
// ============================================

// K8SAPIProxyRequest Agent 通知 Endpoint 的 K8S API 代理请求
message K8SAPIProxyRequest {
  string session_id = 1; // 会话 ID
}

// K8SAPIProxyData Endpoint K8S API 代理数据帧
message K8SAPIProxyData {
  bool is_open = 1; // 是否为开启会话请求（首包 true）
  string session_id = 2; // 会话 ID
  string token = 3; // 注册令牌（首包携带）
  bytes data = 4; // 数据载荷（已废弃，使用 http_request/http_response）
  bool is_close = 5; // 是否为关闭通知
  string error = 6; // 错误信息
  string user_name = 7; // Desktop 用户名（仅首包，Agent WhoIs 提取）
  repeated string k8s_groups = 8; // Impersonation 分组（仅首包，Agent ACL 查询）
  
  // 结构化 HTTP 请求/响应（新增）
  K8SAPIHTTPRequest http_request = 9; // HTTP 请求（Agent → Endpoint）
  K8SAPIHTTPResponse http_response = 10; // HTTP 响应（Endpoint → Agent）
}

// K8SAPIHTTPRequest 结构化 HTTP 请求
message K8SAPIHTTPRequest {
  string method = 1; // HTTP 方法（GET/POST/PUT/DELETE/PATCH）
  string path = 2; // 请求路径（/api, /api/v1/nodes 等）
  map<string, string> headers = 3; // 请求头（只传必要的，如 Accept, Content-Type）
  bytes body = 4; // 请求体（POST/PUT/PATCH）
}

// K8SAPIHTTPResponse 结构化 HTTP 响应
message K8SAPIHTTPResponse {
  int32 status_code = 1; // HTTP 状态码（200, 404, 500 等）
  map<string, string> headers = 2; // 响应头（Content-Type 等）
  bytes body = 3; // 响应体
}

// ============================================
// K8S Service 代理（Endpoint K8SService 会话）
// ============================================

// SVCProxyRequest Agent 通知 Endpoint 的 K8S Service 代理请求
message SVCProxyRequest {
  string session_id = 1; // 会话 ID
  string namespace = 2; // 目标命名空间
  string service_name = 3; // 目标 Service 名称
  int32 port = 4; // 目标端口
  string cluster_ip = 5; // ClusterIP（物理节点部署时直连，避免依赖 cluster.local DNS）
}

// EndpointSVCProxyData Endpoint K8S Service 代理数据帧
message EndpointSVCProxyData {
  bool is_open = 1; // 是否为开启会话请求（首包 true）
  string session_id = 2; // 会话 ID
  string token = 3; // 注册令牌（首包携带）
  bytes data = 4; // 数据载荷
  bool is_close = 5; // 是否为关闭通知
  string error = 6; // 错误信息
}

// ============================================
// 原始字节流（用于协议升级，如 kubectl logs/exec）
// ============================================

// RawStreamRequest Agent 通知 Endpoint 的原始字节流请求
message RawStreamRequest {
  string session_id = 1; // 会话 ID
  string user_name = 2; // 用户名
  repeated string k8s_groups = 3; // K8S 分组
}

// RawStreamData 原始字节流数据（用于协议升级）
message RawStreamData {
  bool is_open = 1; // 是否为开启流的首包
  bool is_close = 2; // 是否为关闭流的标志
  string session_id = 3; // 会话 ID
  string token = 4; // Endpoint Token（仅首包）
  string user_name = 5; // 用户名（Agent → Endpoint 首包）
  repeated string k8s_groups = 6; // K8S 分组（Agent → Endpoint 首包）
  bytes data = 7; // 原始字节流数据
  string error = 8; // 错误信息
}
