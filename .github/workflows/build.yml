name: Build Signal Server

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: signal-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: go test ./...

  publish:
    name: Build and Publish Signal Server
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            build_version="${GITHUB_REF_NAME}"
          else
            build_version="sha-${GITHUB_SHA::12}"
          fi
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build Linux AMD64 server
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          GOOS: linux
          GOARCHS: amd64
          BUILD_TARGETS: server
        run: bash scripts/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push server image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Publish build summary
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Signal Server image"
            echo
            echo "- Version: \`${BUILD_VERSION}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
