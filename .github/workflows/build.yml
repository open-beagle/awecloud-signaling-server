name: Release Signal Components

on:
  push:
    branches:
      - "release-v1.0"

permissions:
  contents: read

concurrency:
  group: signal-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version file: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  server:
    name: Build, Publish and Deploy Server
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build Linux binaries
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCHS: amd64,arm64
          BUILD_TARGETS: server
        run: bash scripts/build.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push Server AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.version }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ needs.prepare.outputs.version }}

      - name: Build and push Server ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.version }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ needs.prepare.outputs.version }}

      - name: Create Server multi-arch manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE_REPOSITORY}:${VERSION}" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_ALIYUN_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_ALIYUN_TOKEN }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          kubectl config set-cluster aliyun.beagle \
            --server="$KUBERNETES_SERVER" \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context aliyun.beagle \
            --cluster=aliyun.beagle \
            --user=github-actions \
            --namespace=beagle-access
          kubectl config use-context aliyun.beagle

      - name: Update API deployment
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          image="${SERVER_IMAGE_REPOSITORY}:${VERSION}"
          current_image="$(kubectl get deployment/signal-server -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}')"
          if [ "$current_image" = "$image" ]; then
            kubectl rollout restart deployment/signal-server
          else
            kubectl set image deployment/signal-server server="$image"
          fi
          kubectl rollout status deployment/signal-server --timeout=5m
          kubectl get deployment/signal-server -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}{"\n"}'

      - name: Publish Server release summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Signal Server release"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Source: \`${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}\`"
            echo "- Image: \`${SERVER_IMAGE_REPOSITORY}:${VERSION}\`"
            echo "- Deployment: \`beagle-access/signal-server\`"
          } >> "$GITHUB_STEP_SUMMARY"

  agent:
    name: Publish Agent and Endpoint Binaries
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build Agent and Endpoint binaries
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCHS: amd64,arm64
          BUILD_TARGETS: agent,endpoint
        run: bash scripts/build.sh

      - name: Setup MinIO Client
        run: |
          curl -fsSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/mc

      - name: Publish Agent and Endpoint artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_ALIYUN }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_ALIYUN }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_ALIYUN }}
          SIGNAL_UPDATER_PUBLIC_KEY: ${{ secrets.SIGNAL_UPDATER_PUBLIC_KEY }}
          SIGNAL_UPDATER_PRIVATE_KEY: ${{ secrets.SIGNAL_UPDATER_PRIVATE_KEY }}
          SIGNAL_UPDATER_KEY_ID: ${{ secrets.SIGNAL_UPDATER_KEY_ID }}
          SIGNAL_ADMIN_USERNAME: ${{ secrets.SIGNAL_ADMIN_USERNAME }}
          SIGNAL_ADMIN_PASSWORD: ${{ secrets.SIGNAL_ADMIN_PASSWORD }}
          SIGNAL_API_URL: https://signal.wodcloud.com
          ARTIFACT_BASE_URL: https://minio-api.wodcloud.com/vscode/awecloud-signaling
        run: |
          set -euo pipefail
          for name in S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY SIGNAL_UPDATER_PUBLIC_KEY SIGNAL_UPDATER_PRIVATE_KEY SIGNAL_UPDATER_KEY_ID SIGNAL_ADMIN_USERNAME SIGNAL_ADMIN_PASSWORD; do
            test -n "${!name}" || { echo "Missing required secret: ${name}" >&2; exit 1; }
          done
          [[ "${SIGNAL_UPDATER_KEY_ID}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid SIGNAL_UPDATER_KEY_ID" >&2; exit 1; }

          mc alias set aliyun --api=S3v4 "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
          s3_bucket="aliyun/vscode/awecloud-signaling"

          agent_amd64_sha="$(sha256sum bin/signal_agent-linux-amd64 | awk '{print $1}')"
          agent_arm64_sha="$(sha256sum bin/signal_agent-linux-arm64 | awk '{print $1}')"
          agent_amd64_size="$(stat -c %s bin/signal_agent-linux-amd64)"
          agent_arm64_size="$(stat -c %s bin/signal_agent-linux-arm64)"
          agent_amd64_signature="$(go run ./cmd/updater-sign "${agent_amd64_sha}")"
          agent_arm64_signature="$(go run ./cmd/updater-sign "${agent_arm64_sha}")"
          endpoint_amd64_sha="$(sha256sum bin/signal_endpoint-linux-amd64 | awk '{print $1}')"
          endpoint_arm64_sha="$(sha256sum bin/signal_endpoint-linux-arm64 | awk '{print $1}')"

          sed \
            -e "s|__SIGNAL_UPDATER_PUBLIC_KEY__|${SIGNAL_UPDATER_PUBLIC_KEY}|g" \
            -e "s|__SIGNAL_UPDATER_KEY_ID__|${SIGNAL_UPDATER_KEY_ID}|g" \
            scripts/install_agent.sh > install_agent.sh
          chmod 0755 install_agent.sh
          mc cp install_agent.sh "${s3_bucket}/install_agent.sh"
          mc cp scripts/install_signal.sh "${s3_bucket}/install_signal.sh"
          mc cp scripts/install_endpoint.sh "${s3_bucket}/install_endpoint.sh"

          upload_immutable() {
            local source="$1" target="$2" expected_sha="$3" existing_sha
            if mc stat "${target}" >/dev/null 2>&1; then
              existing_sha="$(mc cat "${target}" | sha256sum | awk '{print $1}')"
              test "${existing_sha}" = "${expected_sha}" || { echo "Immutable artifact conflict: ${target}" >&2; exit 1; }
              return
            fi
            mc cp "${source}" "${target}"
            existing_sha="$(mc cat "${target}" | sha256sum | awk '{print $1}')"
            test "${existing_sha}" = "${expected_sha}" || { echo "Uploaded artifact verification failed: ${target}" >&2; exit 1; }
          }

          agent_amd64_object="${s3_bucket}/agent/artifacts/linux/amd64/${agent_amd64_sha}/signal_agent"
          agent_arm64_object="${s3_bucket}/agent/artifacts/linux/arm64/${agent_arm64_sha}/signal_agent"
          upload_immutable bin/signal_agent-linux-amd64 "${agent_amd64_object}" "${agent_amd64_sha}"
          upload_immutable bin/signal_agent-linux-arm64 "${agent_arm64_object}" "${agent_arm64_sha}"
          mc cp bin/signal_endpoint-linux-amd64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc cp bin/signal_endpoint-linux-arm64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          mc stat "${agent_amd64_object}"
          mc stat "${agent_arm64_object}"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          login_response="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg username "${SIGNAL_ADMIN_USERNAME}" --arg password "${SIGNAL_ADMIN_PASSWORD}" '{username: $username, password: $password}')" \
            "${SIGNAL_API_URL}/api/v1/admin/auth/login")"
          admin_token="$(jq -er '.data.token' <<<"${login_response}")"

          releases_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${admin_token}" \
            "${SIGNAL_API_URL}/api/v1/admin/updater/releases?component=agent")"
          release_entry="$(jq -c --arg version "${VERSION}" --arg commit "${GITHUB_SHA}" \
            '.data[] | select(.version == $version and .commit_id == $commit)' <<<"${releases_response}" | head -1)"

          if [ -z "${release_entry}" ]; then
            release_payload="$(jq -n \
              --arg version "${VERSION}" --arg commit "${GITHUB_SHA}" --arg key_id "${SIGNAL_UPDATER_KEY_ID}" \
              --arg amd64_url "${ARTIFACT_BASE_URL}/agent/artifacts/linux/amd64/${agent_amd64_sha}/signal_agent" \
              --arg arm64_url "${ARTIFACT_BASE_URL}/agent/artifacts/linux/arm64/${agent_arm64_sha}/signal_agent" \
              --arg amd64_sha "${agent_amd64_sha}" --arg arm64_sha "${agent_arm64_sha}" \
              --arg amd64_signature "${agent_amd64_signature}" --arg arm64_signature "${agent_arm64_signature}" \
              --argjson amd64_size "${agent_amd64_size}" --argjson arm64_size "${agent_arm64_size}" \
              '{component: "agent", version: $version, commit_id: $commit, channel: "stable", release_notes: ("Agent build " + $commit), artifacts: [
                {os: "linux", arch: "amd64", role: "app", package_type: "binary", filename: "signal_agent", download_url: $amd64_url, size: $amd64_size, sha256: $amd64_sha, signature: $amd64_signature, key_id: $key_id},
                {os: "linux", arch: "arm64", role: "app", package_type: "binary", filename: "signal_agent", download_url: $arm64_url, size: $arm64_size, sha256: $arm64_sha, signature: $arm64_signature, key_id: $key_id}
              ]}')"
            create_response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${admin_token}" -H 'Content-Type: application/json' \
              -d "${release_payload}" "${SIGNAL_API_URL}/api/v1/admin/updater/releases")"
            release_id="$(jq -er '.data.release.id' <<<"${create_response}")"
            release_status="draft"
          else
            release_id="$(jq -er '.id' <<<"${release_entry}")"
            release_status="$(jq -er '.status' <<<"${release_entry}")"
            release_detail="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${admin_token}" "${SIGNAL_API_URL}/api/v1/admin/updater/releases/${release_id}")"
            jq -e --arg amd64 "${agent_amd64_sha}" --arg arm64 "${agent_arm64_sha}" \
              '(.data.artifacts | length) == 2 and
               any(.data.artifacts[]; .os == "linux" and .arch == "amd64" and .sha256 == $amd64) and
               any(.data.artifacts[]; .os == "linux" and .arch == "arm64" and .sha256 == $arm64)' \
              <<<"${release_detail}" >/dev/null || { echo "Existing Release artifact identity conflict" >&2; exit 1; }
          fi

          if [ "${release_status}" = "draft" ]; then
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${admin_token}" \
              "${SIGNAL_API_URL}/api/v1/admin/updater/releases/${release_id}/publish" >/dev/null
          elif [ "${release_status}" != "published" ]; then
            echo "Release ${release_id} is not publishable: ${release_status}" >&2
            exit 1
          fi

          published_release="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${admin_token}" \
            "${SIGNAL_API_URL}/api/v1/admin/updater/releases/${release_id}")"
          agent_amd64_artifact_id="$(jq -er '.data.artifacts[] | select(.os == "linux" and .arch == "amd64") | .id' <<<"${published_release}")"
          agent_arm64_artifact_id="$(jq -er '.data.artifacts[] | select(.os == "linux" and .arch == "arm64") | .id' <<<"${published_release}")"
          {
            echo "AGENT_RELEASE_ID=${release_id}"
            echo "AGENT_AMD64_ARTIFACT_ID=${agent_amd64_artifact_id}"
            echo "AGENT_ARM64_ARTIFACT_ID=${agent_arm64_artifact_id}"
            echo "AGENT_AMD64_SHA256=${agent_amd64_sha}"
            echo "AGENT_ARM64_SHA256=${agent_arm64_sha}"
          } >> "$GITHUB_ENV"

          jq -n \
            --arg version "${VERSION}" --arg commit_id "${GITHUB_SHA}" \
            --arg build_date "$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${agent_amd64_sha}" --arg arm64_sha "${agent_arm64_sha}" \
            --arg amd64_url "${ARTIFACT_BASE_URL}/agent/artifacts/linux/amd64/${agent_amd64_sha}/signal_agent" \
            --arg arm64_url "${ARTIFACT_BASE_URL}/agent/artifacts/linux/arm64/${agent_arm64_sha}/signal_agent" \
            '{version: $version, commit_id: $commit_id, build_date: $build_date, files: {"linux-amd64": $amd64_url, "linux-arm64": $arm64_url}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_agent-version.json
          jq -n \
            --arg version "${VERSION}" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${endpoint_amd64_sha}" \
            --arg arm64_sha "${endpoint_arm64_sha}" \
            '{version: $version, build_date: $build_date, files: {"linux-amd64": ("signal_endpoint-" + $version + "-linux-amd64"), "linux-arm64": ("signal_endpoint-" + $version + "-linux-arm64")}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_endpoint-version.json

          # Update mutable pointers only after all immutable artifacts are available.
          mc cp signal_agent-version.json "${s3_bucket}/signal_agent-version.json"
          mc cp signal_endpoint-version.json "${s3_bucket}/signal_endpoint-version.json"

      - name: Publish Agent release summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Signal Agent and Endpoint release"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Source: \`${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}\`"
            echo "- Release ID: \`${AGENT_RELEASE_ID}\`"
            echo "- Agent linux/amd64: \`${AGENT_AMD64_ARTIFACT_ID}\` / \`${AGENT_AMD64_SHA256}\`"
            echo "- Agent linux/arm64: \`${AGENT_ARM64_ARTIFACT_ID}\` / \`${AGENT_ARM64_SHA256}\`"
            echo "- Endpoint binaries: published to S3"
          } >> "$GITHUB_STEP_SUMMARY"
