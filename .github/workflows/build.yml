name: Build Signal Server

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version in server/version to registry and S3
        required: true
        type: boolean
        default: false
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: signal-server-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server
  AGENT_IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: go test ./...

  publish:
    name: Build and Publish Signal Components
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve build version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          file_version="$(tr -d '[:space:]' < version)"
          if [[ ! "${file_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version file: ${file_version}" >&2
            exit 1
          fi

          is_release=false
          build_version="sha-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${file_version}" ]]; then
              echo "Git tag ${GITHUB_REF_NAME} does not match version ${file_version}" >&2
              exit 1
            fi
            is_release=true
            build_version="${file_version}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${PUBLISH_RELEASE}" == "true" ]]; then
            is_release=true
            build_version="${file_version}"
          fi

          echo "file_version=${file_version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build Linux binaries
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          GOOS: linux
        run: |
          if [[ "${IS_RELEASE}" == "true" ]]; then
            GOARCHS=amd64,arm64 BUILD_TARGETS=server,agent,endpoint bash scripts/build.sh
          else
            GOARCHS=amd64 BUILD_TARGETS=server bash scripts/build.sh
          fi

      - name: Set up QEMU
        if: steps.version.outputs.is_release == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push branch Server image
        if: steps.version.outputs.is_release != 'true'
        id: branch_server_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Build and push Release Server AMD64 image
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Build and push Release Server ARM64 image
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Create Release Server multi-arch manifest
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE_REPOSITORY}:${VERSION}" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: Build and push Release Agent AMD64 image
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AGENT_IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Build and push Release Agent ARM64 image
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.AGENT_IMAGE_REPOSITORY }}:${{ steps.version.outputs.build_version }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.build_version }}

      - name: Create Release Agent multi-arch manifest
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          docker buildx imagetools create \
            -t "${AGENT_IMAGE_REPOSITORY}:${VERSION}" \
            "${AGENT_IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${AGENT_IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: Setup MinIO Client
        if: steps.version.outputs.is_release == 'true'
        run: |
          curl -fsSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/mc

      - name: Publish Release Agent and Endpoint artifacts
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.build_version }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_ALIYUN }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_ALIYUN }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_ALIYUN }}
        run: |
          mc alias set aliyun --api=S3v4 "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
          s3_bucket="aliyun/vscode/awecloud-signaling"

          agent_amd64_sha="$(sha256sum bin/signal_agent-linux-amd64 | awk '{print $1}')"
          agent_arm64_sha="$(sha256sum bin/signal_agent-linux-arm64 | awk '{print $1}')"
          endpoint_amd64_sha="$(sha256sum bin/signal_endpoint-linux-amd64 | awk '{print $1}')"
          endpoint_arm64_sha="$(sha256sum bin/signal_endpoint-linux-arm64 | awk '{print $1}')"

          mc cp scripts/install_agent.sh "${s3_bucket}/install_agent.sh"
          mc cp scripts/install_endpoint.sh "${s3_bucket}/install_endpoint.sh"
          mc cp bin/signal_agent-linux-amd64 "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc cp bin/signal_agent-linux-arm64 "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc cp bin/signal_endpoint-linux-amd64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc cp bin/signal_endpoint-linux-arm64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          mc stat "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc stat "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          jq -n \
            --arg version "${VERSION}" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${agent_amd64_sha}" \
            --arg arm64_sha "${agent_arm64_sha}" \
            '{version: $version, build_date: $build_date, files: {"linux-amd64": ("signal_agent-" + $version + "-linux-amd64"), "linux-arm64": ("signal_agent-" + $version + "-linux-arm64")}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_agent-version.json
          jq -n \
            --arg version "${VERSION}" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${endpoint_amd64_sha}" \
            --arg arm64_sha "${endpoint_arm64_sha}" \
            '{version: $version, build_date: $build_date, files: {"linux-amd64": ("signal_endpoint-" + $version + "-linux-amd64"), "linux-arm64": ("signal_endpoint-" + $version + "-linux-arm64")}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_endpoint-version.json

          # Publish mutable version pointers only after all immutable artifacts exist.
          mc cp signal_agent-version.json "${s3_bucket}/signal_agent-version.json"
          mc cp signal_endpoint-version.json "${s3_bucket}/signal_endpoint-version.json"

          mc anonymous set download "${s3_bucket}/install_agent.sh"
          mc anonymous set download "${s3_bucket}/install_endpoint.sh"
          mc anonymous set download "${s3_bucket}/signal_agent-version.json"
          mc anonymous set download "${s3_bucket}/signal_endpoint-version.json"
          mc anonymous set download "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc anonymous set download "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc anonymous set download "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc anonymous set download "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

      - name: Publish build summary
        env:
          VERSION: ${{ steps.version.outputs.build_version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          BRANCH_IMAGE_DIGEST: ${{ steps.branch_server_image.outputs.digest }}
        run: |
          {
            echo "### Signal build"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Release: \`${IS_RELEASE}\`"
            if [[ "${IS_RELEASE}" == "true" ]]; then
              echo "- Server image: \`${SERVER_IMAGE_REPOSITORY}:${VERSION}\`"
              echo "- Agent image: \`${AGENT_IMAGE_REPOSITORY}:${VERSION}\`"
              echo "- Agent/Endpoint artifacts: published to S3"
            else
              echo "- Server digest: \`${BRANCH_IMAGE_DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
