name: Release Signal Components

on:
  push:
    branches:
      - "release-v1.0"

permissions:
  contents: read

concurrency:
  group: signal-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server
  AGENT_IMAGE_REPOSITORY: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent

jobs:
  release:
    name: Test, Build and Publish Signal Components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version file: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Test server
        run: go test ./...

      - name: Build Linux binaries
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          GOOS: linux
          GOARCHS: amd64,arm64
          BUILD_TARGETS: server,agent,endpoint
        run: bash scripts/build.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push Server AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Build and push Server ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.SERVER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Create Server multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE_REPOSITORY}:${VERSION}" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${SERVER_IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: Build and push Agent AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AGENT_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Build and push Agent ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.AGENT_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Create Agent multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${AGENT_IMAGE_REPOSITORY}:${VERSION}" \
            "${AGENT_IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${AGENT_IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: Setup MinIO Client
        run: |
          curl -fsSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/mc

      - name: Publish Agent and Endpoint artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_ALIYUN }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_ALIYUN }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_ALIYUN }}
        run: |
          mc alias set aliyun --api=S3v4 "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
          s3_bucket="aliyun/vscode/awecloud-signaling"

          agent_amd64_sha="$(sha256sum bin/signal_agent-linux-amd64 | awk '{print $1}')"
          agent_arm64_sha="$(sha256sum bin/signal_agent-linux-arm64 | awk '{print $1}')"
          endpoint_amd64_sha="$(sha256sum bin/signal_endpoint-linux-amd64 | awk '{print $1}')"
          endpoint_arm64_sha="$(sha256sum bin/signal_endpoint-linux-arm64 | awk '{print $1}')"

          mc cp scripts/install_agent.sh "${s3_bucket}/install_agent.sh"
          mc cp scripts/install_signal.sh "${s3_bucket}/install_signal.sh"
          mc cp scripts/install_endpoint.sh "${s3_bucket}/install_endpoint.sh"
          mc cp bin/signal_agent-linux-amd64 "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc cp bin/signal_agent-linux-arm64 "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc cp bin/signal_endpoint-linux-amd64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc cp bin/signal_endpoint-linux-arm64 "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          mc stat "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc stat "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc stat "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

          jq -n \
            --arg version "${VERSION}" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${agent_amd64_sha}" \
            --arg arm64_sha "${agent_arm64_sha}" \
            '{version: $version, build_date: $build_date, files: {"linux-amd64": ("signal_agent-" + $version + "-linux-amd64"), "linux-arm64": ("signal_agent-" + $version + "-linux-arm64")}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_agent-version.json
          jq -n \
            --arg version "${VERSION}" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "${endpoint_amd64_sha}" \
            --arg arm64_sha "${endpoint_arm64_sha}" \
            '{version: $version, build_date: $build_date, files: {"linux-amd64": ("signal_endpoint-" + $version + "-linux-amd64"), "linux-arm64": ("signal_endpoint-" + $version + "-linux-arm64")}, sha256: {"linux-amd64": $amd64_sha, "linux-arm64": $arm64_sha}}' \
            > signal_endpoint-version.json

          # Update mutable pointers only after all immutable artifacts are available.
          mc cp signal_agent-version.json "${s3_bucket}/signal_agent-version.json"
          mc cp signal_endpoint-version.json "${s3_bucket}/signal_endpoint-version.json"

          mc anonymous set download "${s3_bucket}/install_agent.sh"
          mc anonymous set download "${s3_bucket}/install_signal.sh"
          mc anonymous set download "${s3_bucket}/install_endpoint.sh"
          mc anonymous set download "${s3_bucket}/signal_agent-version.json"
          mc anonymous set download "${s3_bucket}/signal_endpoint-version.json"
          mc anonymous set download "${s3_bucket}/signal_agent-${VERSION}-linux-amd64"
          mc anonymous set download "${s3_bucket}/signal_agent-${VERSION}-linux-arm64"
          mc anonymous set download "${s3_bucket}/signal_endpoint-${VERSION}-linux-amd64"
          mc anonymous set download "${s3_bucket}/signal_endpoint-${VERSION}-linux-arm64"

      - name: Publish release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Signal release"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Source: \`${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}\`"
            echo "- Server image: \`${SERVER_IMAGE_REPOSITORY}:${VERSION}\`"
            echo "- Agent image: \`${AGENT_IMAGE_REPOSITORY}:${VERSION}\`"
            echo "- Agent/Endpoint artifacts: published to S3"
          } >> "$GITHUB_STEP_SUMMARY"
