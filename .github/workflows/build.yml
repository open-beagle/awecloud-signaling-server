name: Build Images

on:
  push:
    branches:
      - main

env:
  BUILD_VERSION: v0.1.0

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Build Frontend
        run: bash ./scripts/build_frontend.sh
      
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Cross Build
        run: |
          docker run --rm -v ${{ github.workspace }}:/go/src/github.com/open-beagle/awecloud-signaling-server \
            -w /go/src/github.com/open-beagle/awecloud-signaling-server \
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} \
            -e GOARCHS=amd64,arm64 \
            registry.cn-qingdao.aliyuncs.com/wod/golang:1.24-alpine \
            bash ./.beagle/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Server Images
      - name: Build Server AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:${{ env.BUILD_VERSION }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Build Server ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/server.dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:${{ env.BUILD_VERSION }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Create Server multi-arch manifest
        run: |
          docker buildx imagetools create -t registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:${{ env.BUILD_VERSION }}-amd64 \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:${{ env.BUILD_VERSION }}-arm64

      # Agent Images
      - name: Build Agent AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:${{ env.BUILD_VERSION }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Build Agent ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/agent.dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:${{ env.BUILD_VERSION }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Create Agent multi-arch manifest
        run: |
          docker buildx imagetools create -t registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:${{ env.BUILD_VERSION }}-amd64 \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:${{ env.BUILD_VERSION }}-arm64
