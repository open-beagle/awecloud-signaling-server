# Tailscale 网段规划配置
# 
# 说明：
# 1. 这是设计时确定的静态配置，编译时 Copy 到镜像中
# 2. 启动时会读取此配置并写入数据库（如果数据库为空）
# 3. 运行时可在 Web 界面动态修改，修改后的值存储在数据库中
# 4. 数据库中的配置优先级高于此文件
#
# 使用场景：
# - Dockerfile: COPY config/network.toml /app/config/
# - 启动时: Server 读取此文件作为默认值
# - 运行时: 管理员在 Web 界面修改网段规划

# Agent 网段配置（服务端节点）
[agent]
# CIDR 网段
# 默认: 100.64.0.0/16
# 容量: 65534 个 Agent
cidr = "100.64.0.0/16"

# IP 分配范围
# 起始 IP: 100.64.0.1
# 结束 IP: 100.64.255.254
ip_start = "100.64.0.1"
ip_end = "100.64.255.254"

# 说明
description = "Agent 网段，用于服务端节点（K8S、NAS、云服务器等）"

# Desktop 网段配置（客户端节点）
[desktop]
# CIDR 网段
# 默认: 100.65.0.0/16
# 容量: 65534 个 Desktop 实例
cidr = "100.65.0.0/16"

# IP 分配范围
# 起始 IP: 100.65.0.1
# 结束 IP: 100.65.255.254
ip_start = "100.65.0.1"
ip_end = "100.65.255.254"

# 说明
description = "Desktop 网段，用于客户端节点（员工电脑）"

# Server 网段配置（管理节点）
[server]
# CIDR 网段
# 默认: 100.66.0.0/16
# 容量: 65534 个 Server 节点
cidr = "100.66.0.0/16"

# IP 分配范围
# 起始 IP: 100.66.0.1
# 结束 IP: 100.66.255.254
ip_start = "100.66.0.1"
ip_end = "100.66.255.254"

# 说明
description = "Server 网段，用于管理节点（Headscale、Server 等）"

# 网段规划说明
[metadata]
# 设计版本
version = "1.0.0"

# 设计日期
design_date = "2026-01-09"

# 网段分配策略
# - Agent:   100.64.0.0/16  (0.x 段)
# - Desktop: 100.65.0.0/16  (1.x 段)
# - Server:  100.66.0.0/16  (2.x 段)
# - 预留:    100.67-127.x.x (扩展用)
allocation_strategy = """
网段一览:
┌──────────────────┬─────────────────────┬──────────┐
│ 网段             │ 用途                │ 容量     │
├──────────────────┼─────────────────────┼──────────┤
│ 100.64.0.0/16    │ Agent (服务端)      │ 65534    │
│ 100.65.0.0/16    │ Desktop (客户端)    │ 65534    │
│ 100.66.0.0/16    │ Server (管理端)     │ 65534    │
│ 100.67-127.x.x   │ 预留扩展            │ -        │
└──────────────────┴─────────────────────┴──────────┘
"""

# 安全隔离说明
security_notes = """
1. Agent 和 Desktop 使用不同网段，便于 ACL 规则管理
2. 同组 Agent 可以互访（通过 ACL 控制）
3. Desktop 访问 Agent 需要显式授权
4. 外部 Agent 只能访问授权的特定端口
"""
