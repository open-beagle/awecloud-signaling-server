# Server Deployment (Tailscale 版本)
# 移除 FRP 端口，新增 Headscale 集成
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awecloud-signaling-server
  namespace: beagle-access
  labels:
    app: awecloud-signaling-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: awecloud-signaling-server
  template:
    metadata:
      labels:
        app: awecloud-signaling-server
    spec:
      containers:
        - name: server
          image: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:v0.2.0
          imagePullPolicy: Always
          ports:
            # Web/gRPC 统一端口
            - name: web
              containerPort: 8080
              protocol: TCP
          env:
            # JWT Secret（必需）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: awecloud-signaling-server
                  key: jwt-secret
            # Headscale API Key（必需）
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: awecloud-signaling-server
                  key: headscale-api-key
            # Pod 命名空间（通过 Downward API 获取）
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Headscale URL（可选，覆盖配置文件默认值）
            # - name: HEADSCALE_URL
            #   value: "http://headscale:8080"
            # OpenTelemetry 配置（可选）
            # K8s 内部访问 otel-collector
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # - name: OTEL_SERVICE_NAME
            #   value: "signaling-server"
            # - name: OTEL_SERVICE_NAMESPACE
            #   value: "default"
          volumeMounts:
            - name: data
              mountPath: /home/code/data
            - name: logs
              mountPath: /home/code/logs
            - name: config
              mountPath: /home/code/config
          # 存活性探测
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪性探测
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: awecloud-signaling-server
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: awecloud-signaling-server
