# Headscale ConfigMap
# Tailscale 控制平面配置 (v0.23+)
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale
  namespace: beagle-access
  labels:
    app: headscale
data:
  config.yaml: |
    # Headscale v0.23+ 配置
    # 参考: https://github.com/juanfont/headscale/blob/main/config-example.yaml

    server_url: https://signaling.example.com/headscale
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true

    # Noise 协议密钥
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    # IP 地址段
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    # DERP 中继配置
    derp:
      server:
        enabled: true
        region_id: 900
        region_code: "private"
        region_name: "Private DERP"
        stun_listen_addr: "0.0.0.0:3479"
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
      urls: []
      paths: []
      auto_update_enabled: false
      update_frequency: 24h

    # 数据库
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true

    disable_check_updates: true
    ephemeral_node_inactivity_timeout: 30m

    # DNS
    dns:
      magic_dns: false
      base_domain: ts.local
      override_local_dns: false

    # 日志
    log:
      format: text
      level: info

    # ACL 策略
    policy:
      mode: file
      path: ""
