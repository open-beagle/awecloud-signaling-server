# Traefik IngressRoute for Headscale
#
# 路由规则：
#   /ts2021      → Headscale ts2021 协议端点（Noise 协议握手，HTTP/1.1）
#   /key         → Headscale key 端点（获取 server public key）
#   /derp        → DERP 中继服务端点（长连接，需要特殊超时配置）
#   /headscale/* → Headscale gRPC API（HTTP/2，端口 50443）
#
# 关键配置：
#   - ts2021/key/derp: 强制 HTTP/1.1（Tailscale 需要 HTTP Upgrade）
#   - /headscale gRPC: 默认 HTTP/2，后端使用 h2c 连接 50443 端口
#   - /derp: 需要长超时配置，因为是 WebSocket 长连接
#
# 重要说明：
#   Tailscale 客户端硬编码 /ts2021 路径，不支持自定义路径前缀！
#   所以必须在根路径配置 /ts2021 和 /key 路由。
#
# 部署命令：
#   kubectl apply -f headscale-ingressroute.yaml

---
# TLSOption: 强制 HTTP/1.1（禁用 HTTP/2）
# Tailscale ts2021 协议需要 HTTP Upgrade header，HTTP/2 协议不支持 Upgrade 机制
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: TLSOption
metadata:
  name: headscale-h1only
  namespace: beagle-access
  labels:
    app: headscale
spec:
  alpnProtocols:
    - http/1.1

---
# Middleware: 去除 /headscale 前缀
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: Middleware
metadata:
  name: headscale-stripprefix
  namespace: beagle-access
  labels:
    app: headscale
spec:
  stripPrefix:
    prefixes:
      - /headscale

---
# ServersTransport: DERP 长连接传输配置
# DERP 使用 HTTP Upgrade 升级为长连接，需要禁用超时
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: ServersTransport
metadata:
  name: headscale-derp-transport
  namespace: beagle-access
  labels:
    app: headscale
spec:
  # 禁用响应转发超时（0 表示无限）
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0s
    idleConnTimeout: 0s

---
# IngressRoute: Headscale Tailscale 协议路由（HTTP/1.1）
# ts2021/key/derp 需要 HTTP/1.1 因为 Tailscale 使用 HTTP Upgrade
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: beagle-access
  labels:
    app: headscale
spec:
  entryPoints:
    - websecure
  routes:
    # Tailscale ts2021 协议端点（Noise 协议握手）
    # 注意：Tailscale 客户端硬编码 /ts2021 路径，不支持自定义前缀
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/ts2021`)
      services:
        - name: headscale
          port: 8080
    # Tailscale key 端点（获取 server public key）
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/key`)
      services:
        - name: headscale
          port: 8080
    # DERP 中继服务端点（长连接）
    # 使用专用 ServersTransport 禁用超时
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/derp`)
      services:
        - name: headscale
          port: 8080
          serversTransport: headscale-derp-transport
  tls:
    certResolver: default
    options:
      name: headscale-h1only

---
# IngressRoute: Headscale gRPC 路由（HTTP/2）
# Server 通过此路由访问 Headscale gRPC API
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-grpc
  namespace: beagle-access
  labels:
    app: headscale
spec:
  entryPoints:
    - websecure
  routes:
    # gRPC API（默认 HTTP/2）
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/headscale`)
      middlewares:
        - name: headscale-stripprefix
      services:
        - name: headscale
          port: 50443
          scheme: h2c
  tls:
    certResolver: default
