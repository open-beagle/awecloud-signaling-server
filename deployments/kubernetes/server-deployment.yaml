apiVersion: apps/v1
kind: Deployment
metadata:
  name: awecloud-signaling-server
  namespace: awecloud
  labels:
    app: awecloud-signaling-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: awecloud-signaling-server
  template:
    metadata:
      labels:
        app: awecloud-signaling-server
    spec:
      containers:
        - name: server
          image: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:v0.1.0
          imagePullPolicy: Always
          ports:
            - name: frp
              containerPort: 7000
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
          env:
            # JWT Secret（必需）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: awecloud-signaling-server
                  key: jwt-secret
            # FRP 公网访问地址（可选）
            # 如果配置，Agent/Desktop 将使用此地址连接 FRP 服务
            # 格式: wss://domain/path 或 ws://domain/path
            # 示例: wss://signaling.example.com/ws
            - name: PUBLIC_URL
              value: ""
          volumeMounts:
            - name: data
              mountPath: /home/code/data
            - name: logs
              mountPath: /home/code/logs
            - name: config
              mountPath: /home/code/config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: awecloud-signaling-server
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: awecloud-signaling-server
