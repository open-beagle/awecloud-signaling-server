apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-server
  namespace: beagle-access
  labels:
    app: signal-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-server
  template:
    metadata:
      labels:
        app: signal-server
    spec:
      containers:
        - name: server
          image: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-server:v0.2.4
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          env:
            # JWT Secret（必需）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: signal-server
                  key: jwt-secret
            # Headscale API Key（必需）
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signal-server
                  key: headscale-api-key
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
          # 存活性探测 - 检查进程是否存活
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪性探测 - 检查服务是否就绪
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signal-server
        - name: config
          configMap:
            name: signal-server
