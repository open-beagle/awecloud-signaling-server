# Headscale Service
# 暴露 Headscale 服务
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: beagle-access
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    # HTTP API（Traefik 路由）
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    # gRPC（内部使用）
    - name: grpc
      port: 50443
      targetPort: 50443
      protocol: TCP
    # Metrics（可选，用于监控）
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
# DERP STUN Service（UDP）
# 需要 NodePort 或 LoadBalancer 暴露 UDP 端口
apiVersion: v1
kind: Service
metadata:
  name: headscale-stun
  namespace: beagle-access
  labels:
    app: headscale
spec:
  type: NodePort
  selector:
    app: headscale
  ports:
    - name: stun
      port: 3479
      targetPort: 3479
      protocol: UDP
      # 固定 NodePort，便于防火墙配置
      nodePort: 30479
