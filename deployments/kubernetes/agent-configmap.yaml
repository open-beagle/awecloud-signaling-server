apiVersion: v1
kind: ConfigMap
metadata:
  name: awecloud-agent-config
  namespace: awecloud
data:
  agent-name: "agent-k8s-001"
  server-address: "awecloud-signaling-server.awecloud.svc.cluster.local"
  server-port: "7000"
  agent.toml: |
    [agent]
    agent_name = "agent-k8s-001"
    agent_token = ""  # 从Secret获取

    [server]
    address = "awecloud-signaling-server.awecloud.svc.cluster.local"
    port = 7000
    tls_enable = false
