# Traefik IngressRoute for AWECloud Signaling Server (Tailscale 版本)
#
# 路由规则：
# 1. /headscale/* → Headscale 控制平面
# 2. /ts2021      → Headscale Tailscale 协议
# 3. /derp        → DERP 中继服务
# 4. /*           → Server 业务 API（默认）
#
# 部署命令：
#   kubectl apply -f server-ingressroute-tailscale.yaml

---
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: IngressRoute
metadata:
  name: awecloud-signaling-server
  namespace: beagle-access
  labels:
    app: awecloud-signaling-server
spec:
  entryPoints:
    - websecure
  routes:
    # HTTP/gRPC 统一路由（默认）
    # 使用 h2c (HTTP/2 Cleartext) 同时支持 Web 和 gRPC
    - kind: Rule
      match: Host(`signaling.example.com`)
      services:
        - name: awecloud-signaling-server
          port: 8080
          scheme: h2c
      priority: 1
  tls: {}

---
# Middleware: 去除 /headscale 前缀
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: Middleware
metadata:
  name: headscale-stripprefix
  namespace: beagle-access
  labels:
    app: headscale
spec:
  stripPrefix:
    prefixes:
      - /headscale
