# Headscale Secret
# 存储敏感配置信息
apiVersion: v1
kind: Secret
metadata:
  name: headscale
  namespace: beagle-access
  labels:
    app: headscale
type: Opaque
stringData:
  # Headscale API Key（部署后通过命令生成）
  # 生成命令: kubectl exec -it deploy/headscale -- headscale apikeys create --expiration 365d
  # 生成后更新此 Secret
  api-key: "placeholder-update-after-deployment"
