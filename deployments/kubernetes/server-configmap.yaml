apiVersion: v1
kind: ConfigMap
metadata:
  name: awecloud-server-config
  namespace: awecloud
data:
  server.toml: |
    [server]
    bind_addr = "0.0.0.0"
    bind_port = 7000
    transport_protocol = "websocket"

    [database]
    type = "sqlite"
    path = "./data/awecloud.db"

    [web]
    listen_addr = "0.0.0.0"
    listen_port = 8080
    default_admin_username = "admin"
    default_admin_password = "admin123"

    [security]
    jwt_secret = "change-this-in-production"
    jwt_expire_hours = 24

    [log]
    level = "info"
    file = "./logs/server.log"
