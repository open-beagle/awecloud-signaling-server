# Traefik IngressRoute for AWECloud Signaling Server
# 
# 功能说明：
# 1. FRP WebSocket 路由（自定义路径）：/ws 路径重写为 /~!frp，转发到 7000 端口
# 2. FRP WebSocket 路由（原生路径）：/~!frp 直接转发到 7000 端口（不重写）
# 3. HTTP/gRPC 统一路由：使用 h2c (HTTP/2 Cleartext) 同时支持 Web 和 gRPC，转发到 8080 端口
#
# 关键配置：
# - scheme: h2c - 使用 HTTP/2 协议与后端通信，支持 gRPC
# - Middleware - 路径重写 /ws → /~!frp（仅用于自定义路径）
#
# 部署命令：
#   kubectl apply -f server-ingressroute.yaml
#   kubectl apply -f server-middleware.yaml

---
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: IngressRoute
metadata:
  name: awecloud-signaling-server
  namespace: beagle-access
  labels:
    app: awecloud-signaling-server
spec:
  entryPoints:
    - websecure
  routes:
    # FRP WebSocket 路由 - 自定义路径（优先级高）
    # 匹配 /ws 路径，重写为 /~!frp 后转发到 FRP Server
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/ws`)
      services:
        - name: awecloud-signaling-server
          port: 7000
      middlewares:
        - name: awecloud-signaling-server

    # FRP WebSocket 路由 - 原生路径
    # 匹配 /~!frp 路径，直接转发到 FRP Server（不重写）
    - kind: Rule
      match: Host(`signaling.example.com`) && PathPrefix(`/~!frp`)
      services:
        - name: awecloud-signaling-server
          port: 7000

    # HTTP/gRPC 统一路由
    # 使用 h2c (HTTP/2 Cleartext) 同时支持 Web 和 gRPC
    - kind: Rule
      match: Host(`signaling.example.com`)
      services:
        - name: awecloud-signaling-server
          port: 8080
          scheme: h2c  # 关键：使用 HTTP/2 协议
  tls: {}

---
apiVersion: bcc.bd-apaas.com/v1alpha1
kind: Middleware
metadata:
  name: awecloud-signaling-server
  namespace: beagle-access
  labels:
    app: awecloud-signaling-server
spec:
  replacePathRegex:
    regex: ^/ws$
    replacement: /~!frp
