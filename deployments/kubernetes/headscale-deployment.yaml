# Headscale Deployment
# Tailscale 控制平面服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: beagle-access
  labels:
    app: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:v0.27.1
          imagePullPolicy: IfNotPresent
          command:
            - headscale
            - serve
          ports:
            # HTTP API
            - name: http
              containerPort: 8080
              protocol: TCP
            # gRPC（内部使用）
            - name: grpc
              containerPort: 50443
              protocol: TCP
            # Metrics
            - name: metrics
              containerPort: 9090
              protocol: TCP
            # DERP STUN（UDP）
            - name: stun
              containerPort: 3479
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: headscale
        - name: data
          persistentVolumeClaim:
            claimName: headscale
