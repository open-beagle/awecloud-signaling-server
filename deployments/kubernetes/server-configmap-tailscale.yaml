# Server ConfigMap (Tailscale 版本)
# 移除 FRP 配置，新增 Tailscale 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: awecloud-signaling-server
  namespace: beagle-access
  labels:
    app: awecloud-signaling-server
data:
  server.toml: |
    # AWECloud Signaling Server 配置文件 (Tailscale 版本)

    [database]
    path = "./data/server.db"

    [web]
    listen_addr = "0.0.0.0"
    listen_port = 8080
    default_admin_username = "admin"
    default_admin_password = "admin123"

    [security]
    jwt_secret = "change-this-in-production"

    [log]
    level = "info"
    file = ""

    # Tailscale 配置（替代原 [server] 段的 FRP 配置）
    # 大部分配置有默认值，可通过 Web 管理界面的系统配置修改
    [tailscale]
    # Headscale 控制平面地址（集群内部地址）
    # 默认值: http://headscale:8080
    headscale_url = "http://headscale:8080"
    # Headscale API 密钥（从环境变量 HEADSCALE_API_KEY 获取）
    headscale_api_key = ""
    # Headscale 命名空间（从环境变量 POD_NAMESPACE 获取，默认: beagle-access）
    # namespace = ""
    
    # 以下配置有默认值，可在 Web 管理界面 > 系统配置 中修改：
    # - derp_url: DERP 服务器地址，默认根据 public_url 自动生成
    # - stun_port: STUN 端口，默认 3479
    # - ip_prefix: IP 地址段，默认 100.64.0.0/10
    # - auth_key_expiry_hours: 预认证密钥有效期，默认 24 小时
