apiVersion: apps/v1
kind: Deployment
metadata:
  name: awecloud-signaling-agent
  namespace: awecloud
  labels:
    app: awecloud-signaling-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: awecloud-signaling-agent
  template:
    metadata:
      labels:
        app: awecloud-signaling-agent
    spec:
      containers:
      - name: agent
        image: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:v0.1.0
        imagePullPolicy: Always
        env:
        # Agent 标识（必需）
        - name: AGENT_NAME
          value: "agent-k8s-001"  # 可以根据需要修改
        # Agent 认证 Token（必需，从 Secret 获取）
        - name: AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: awecloud-agent-secret
              key: agent-token
        volumeMounts:
        - name: logs
          mountPath: /home/code/logs
        - name: config
          mountPath: /home/code/config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: awecloud-agent-config
