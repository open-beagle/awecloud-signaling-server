apiVersion: apps/v1
kind: Deployment
metadata:
  name: awecloud-signaling-agent
  namespace: beagle-access
  labels:
    app: awecloud-signaling-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: awecloud-signaling-agent
  template:
    metadata:
      labels:
        app: awecloud-signaling-agent
    spec:
      containers:
        - name: agent
          image: registry.cn-qingdao.aliyuncs.com/wod/awecloud-signaling-agent:v0.1.2
          imagePullPolicy: Always
          env:
            # Agent 名称（必需）
            - name: SIGNAL_NAME
              value: "agent-k8s-001"
            # Agent 认证 Token（必需，从 Secret 获取）
            - name: SIGNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: awecloud-signaling-agent
                  key: agent-token
            # Server 地址（可选）
            # 格式: http://host:port 或 https://host:port
            - name: SIGNAL_SERVER
              value: "https://signaling.example.com"
          volumeMounts:
            - name: logs
              mountPath: /home/code/logs
          ports:
            - name: health
              containerPort: 8090
              protocol: TCP
          # 存活性探测 - 检查进程是否存活
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪性探测 - 检查连接是否正常
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: logs
          emptyDir: {}
