version: '3.8'

services:
  awecloud-signaling-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
    container_name: awecloud-signaling-server
    ports:
      - "7000:7000"      # FRP控制端口
      - "8080:8080"      # Web管理界面
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/server.toml:/app/config/server.toml
      - ./certs:/app/certs
    restart: unless-stopped
    networks:
      - awecloud-network

networks:
  awecloud-network:
    driver: bridge
